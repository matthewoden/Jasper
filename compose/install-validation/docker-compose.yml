# compose/install-validation/docker-compose.yml
# Phase 8 Plan 08-14 / INSTALL-09 / D-38 / D-48.
# Updated: Phase 16 Plan 16-03 / D-06 (WSL2 container posture).
#
# Purpose: fresh-VM rehearsal of the README install flow on a real
# systemd-enabled Ubuntu image. Catches regressions in the
# `jasper install` / `jasper status` / `jasper doctor` / `jasper uninstall`
# subcommand surface against a real systemd PID 1 (a WSL2-like environment).
#
# Image: jrei/systemd-ubuntu:noble (24.04, amd64-only).
#
# Platform pin: `platform: linux/amd64` is REQUIRED on Apple-Silicon
# developer machines (RESEARCH.md Pitfall 8). Rosetta-2 + Docker Desktop
# transparently emulate amd64; CI runs on amd64 GitHub Actions runners
# so the pin is a no-op there.
#
# `privileged: true` is REQUIRED for systemd-as-PID-1. The container is
# isolated, short-lived, and does not expose any host network ports —
# the threat-model trade-off is documented in 08-14-PLAN.md §threat_model.
#
# WSL2 identity (D-06 / Phase 16 Plan 16-03):
#   This container presents as WSL2 by default so the doctor WSL/systemd
#   check returns "ok" rather than "skip (native Linux — N/A)".
#   test-install.sh provisions at container start (root preamble):
#     /etc/jasper-wsl/osrelease  — contains "5.15.167.4-microsoft-standard-WSL2"
#                                  (the "microsoft" substring satisfies IsWSL())
#     /etc/wsl.conf              — [boot] / systemd=true
#   The coworker shell exports JASPER_OSRELEASE_PATH=/etc/jasper-wsl/osrelease
#   before any jasper invocation so doctor's checkWslSystemd() reads the fake
#   file via the platform.OsreleasePath seam (hardened in plan 16-02).
#   Fixtures live only in the ephemeral container; nothing bleeds into
#   production source trees (threat T-16-05).
#
# Mounts:
#   ../../bin           → /opt/jasper/bin     (built binary, read-only)
#   ../../README.md     → /opt/jasper/README.md (docs validation, read-only)
#   ./test-install.sh   → /opt/jasper/test-install.sh (script, read-only)

services:
  jasper-install-test:
    image: jrei/systemd-ubuntu:noble
    platform: linux/amd64
    privileged: true
    # systemd-as-PID-1 requires the host cgroup namespace on cgroup-v2 hosts
    # (GitHub Actions ubuntu-latest, Colima, modern Docker all default to
    # cgroup v2). Without this, /sbin/init cannot manage the cgroup tree and
    # the container exits 255 immediately. Harmless on cgroup-v1 hosts.
    # (Compose spec property is `cgroup` = host|private; equals `docker run
    # --cgroupns=host`.)
    cgroup: host
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ../../bin:/opt/jasper/bin:ro
      - ../../README.md:/opt/jasper/README.md:ro
      - ./test-install.sh:/opt/jasper/test-install.sh:ro
    command: ["/sbin/init"]
    # "degraded" means boot completed but a non-essential unit failed (e.g.
    # systemd-journald is commonly degraded in containers); the system is still
    # fully usable. Treat running OR degraded as healthy — `is-system-running
    # --wait` alone exits non-zero on degraded and would wedge the gate.
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-system-running | grep -Eq '^(running|degraded)$'"]
      interval: 5s
      timeout: 60s
      retries: 12
