openapi: 3.1.0
info:
  title: Jasper API
  version: 0.1.0
  description: |
    Jasper HTTP API. Phase 1 surface: a single hard-coded note keyed by UUID.
    Phase 2 adds the canonical notes-list endpoint and two admin endpoints
    (migration status, full re-index) backing UX-03 and DATA-10.

    Source of truth: every route Jasper exposes lives in this file (API-01).
    Adding a route here without a Go handler causes a compile error
    under oapi-codegen StrictServerInterface (API-02).
servers:
  - url: /api/v1
    description: Same-origin (Go binary or Vite dev proxy)
tags:
  - { name: notes, description: "Note read and write operations" }
  - { name: admin, description: "Operational endpoints — migration status, full re-index" }
  - { name: tree, description: "File-tree projection over notes/ (TREE-01)" }
  - { name: folders, description: "Folder-only operations (TREE-04, TREE-05, TREE-06, TREE-07)" }
paths:
  /notes:
    get:
      tags: [notes]
      operationId: getNotes
      summary: List all indexed notes (metadata only)
      description: |
        List all indexed notes (metadata only — no content). Backed by the SQLite
        derived index (DATA-09). Phase 2 has no query parameters; Phase 7 will add
        `?q=` and `?tag=` for search and tag filtering.
      responses:
        "200":
          description: List of note metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
    post:
      tags: [notes]
      operationId: postNotes
      summary: Create a new note (TREE-03)
      description: |
        Create a new note under {parent_path}/{title}.md. The server canonicalizes
        the resulting path (NFC + lowercase per DATA-11) and rejects case-insensitive
        collisions per DATA-12. parent_path "" means the vault root. The created
        file is empty (zero bytes) and immediately re-indexed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSummary"
        "400":
          description: Invalid request (missing fields, illegal title chars, parent traversal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision (DATA-12) OR parent_path does not resolve to a folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/{id}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      tags: [notes]
      operationId: getNoteById
      summary: Read a note by UUID
      responses:
        "200":
          description: Note found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [notes]
      operationId: putNoteById
      summary: Replace the content of a note by UUID
      parameters:
        - name: If-Match
          in: header
          required: false
          description: |
            Optimistic concurrency comparator (SYNC-06). When present,
            the server compares this value against the file's current
            updated_at (RFC3339Nano UTC). On mismatch the server
            returns 409 with `code: stale_write` and
            `current_updated_at` in the body — the client surfaces
            SYNC-05's Save-anyway / Discard banner. Permissive when
            absent (curl / automation friendly). Server treats the
            value as an opaque string round-trip; max length 256 chars.
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Note updated; atomic write committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateNoteResponse"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Stale write (SYNC-06) — If-Match mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaleWriteError"
        "500":
          description: Write failure on disk (atomic-rename or fsync error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [notes]
      operationId: deleteNoteById
      summary: Delete a note by UUID (TREE-06)
      description: |
        Delete the note identified by UUID. Removes the underlying `.md` file
        atomically and clears the SQLite index row in the same write transaction.
        404 when the UUID is unknown; 500 when the FS / SQLite operation fails
        and the two stores would be left inconsistent.
      responses:
        "204":
          description: Deleted
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Delete failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/{id}/move:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    post:
      tags: [notes]
      operationId: postNoteMove
      summary: Rename or move a note (TREE-05, TREE-07)
      description: |
        Rename and/or move a note in a single atomic transaction. new_path is a
        canonical relative path under notes/; the server NFC-lowercases it before
        applying. Wiki-link rewrite (LINKS-07) is DEFERRED to Phase 6 — Phase 3 only
        updates the file location and the SQLite index row. Returns the post-move
        NoteSummary so the client can reconcile against any server-side path
        normalization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveNoteRequest"
      responses:
        "200":
          description: Move committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSummary"
        "400":
          description: Invalid request (empty new_path, illegal chars, ".." escape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision with an existing note (DATA-12)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Move failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tree:
    get:
      tags: [tree]
      operationId: getTree
      summary: Return the full folder/file hierarchy under notes/ (TREE-01)
      description: |
        Returns one nested tree document for the entire vault. The shape is a
        tagged union — TreeNode is either {kind:"folder", path, name, children[]}
        or {kind:"note", id, path, title, updated_at}. Sort order: alphabetical
        by name within each level, folders before notes. Used by the sidebar
        FileTree (react-arborist) — Plan 03-06.
      responses:
        "200":
          description: Full tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"
        "500":
          description: Tree projection failed (FS walk / SQLite error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /folders:
    post:
      tags: [folders]
      operationId: postFolders
      summary: Create a folder (TREE-04)
      description: |
        Create an empty folder under {parent_path}/{name}. The server
        canonicalizes the resulting path (NFC + lowercase per DATA-11) and
        rejects case-insensitive collisions. parent_path "" means the vault
        root. Folders are pure FS constructs — there is no `folders` table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderNode"
        "400":
          description: Invalid request (empty name, illegal chars, parent traversal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision OR parent_path does not resolve to a folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [folders]
      operationId: deleteFolder
      summary: Delete a folder (TREE-06) — non-empty requires recursive=true
      description: |
        Delete the folder at the given canonical path. By default (recursive=false)
        the server returns 409 folder_not_empty if the folder has any children.
        The Phase 3 Delete-folder dialog (UI-SPEC §Surface 4) always sets
        recursive=true after the user confirms the content-count copy. Path is
        passed as a query parameter so URL-encoding handles `/` separators
        cleanly — folders have no SQLite identity and so cannot be addressed by
        UUID.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
        - name: recursive
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            When false (default), the server returns 409 folder_not_empty if the
            folder has any children. The Phase 3 Delete-folder dialog (UI-SPEC
            §Surface 4) always sets recursive=true after the user confirms the
            content-count copy.
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid request (missing path, ".." escape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Folder not empty (recursive=false and folder has children)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Delete failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /folders/move:
    post:
      tags: [folders]
      operationId: postFolderMove
      summary: Rename or move a folder (TREE-05, TREE-07)
      description: |
        Atomically renames/moves a folder and re-canonicalizes every contained
        note's path under the new prefix. Implementation note: folders are pure
        FS constructs — there is no `folders` table — so the SQLite update is a
        batch UPDATE notes SET path=... WHERE path LIKE 'old_prefix/%' inside one
        BEGIN IMMEDIATE transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFolderRequest"
      responses:
        "200":
          description: Move committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderNode"
        "400":
          description: Invalid request (empty paths, illegal chars, ".." escape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: old_path does not resolve to a folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision with an existing folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Move failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/status:
    get:
      tags: [admin]
      operationId: getAdminStatus
      summary: Report the migration runner state
      description: |
        Returns the migration runner state for the UX-03 banner. The frontend
        `useMigrationStatus()` hook polls this on mount; Phase 4 will swap the
        client to a `migration:status` WebSocket event without changing the
        wire shape.
      responses:
        "200":
          description: Current migration runner state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationStatus"
  /ws:
    get:
      tags: [ws]
      operationId: getApiV1Ws
      summary: WebSocket endpoint (HTTP/1.1 Upgrade)
      description: |
        Server-broadcast WebSocket. Client opens with
        `?session_id=<uuid>` query parameter (Pitfall 1: client-as-
        authoritative session_id). Server responds with a
        `session:assigned` envelope confirming the id, then streams
        events until disconnect.

        oapi-codegen generates a stub handler for this route which is
        unreachable: lifecycle.go (Plan 04-04) mounts `/ws` via
        wshub.Hub.ServeHTTP BEFORE api.HandlerFromMux. The path exists
        in the spec to satisfy API-01 ("every HTTP route in the spec").

        Origin enforcement: the Accept call in wshub.Hub.ServeHTTP
        (Plan 04-02) sets OriginPatterns: ["localhost:*", "127.0.0.1:*"].
        The OpenAPI spec does NOT and CANNOT enforce origin — that is a
        runtime control on the upgrade handshake (T-04-01).
      x-jasper-websocket: true
      parameters:
        - name: session_id
          in: query
          required: false
          description: |
            Per-tab UUID generated by the client (sessionStorage).
            Server adopts this as the connection's session_id; the
            handshake message echoes it for confirmation. Treated as
            opaque; max length 128 chars enforced in middleware
            (T-04-03).
          schema:
            type: string
            format: uuid
            maxLength: 128
      responses:
        "101":
          description: Switching protocols (WebSocket upgrade)
        "400":
          description: Not a WebSocket request
  /admin/reindex:
    post:
      tags: [admin]
      operationId: postAdminReindex
      summary: Trigger a full or incremental re-index
      description: |
        Phase 2 backs DATA-10: drop the derived tables, re-run migrations on a
        clean schema, and walk every `.md` file. Phase 2 runs synchronously and
        returns 202 only after the rebuild finishes; Phase 4 will switch to async
        execution streaming progress over WebSocket without a contract break.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexRequest"
      responses:
        "202":
          description: Re-index accepted; Phase 2 returns after completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexResponse"
        "409":
          description: A re-index is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Database is in unrecoverable state (Path 3 fired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    NoteId:
      name: id
      in: path
      required: true
      description: UUID of the note (Phase 1 has exactly one — see scratchpad UUID in code)
      schema:
        type: string
        format: uuid
  schemas:
    Note:
      type: object
      required: [id, path, content, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: "00000000-0000-4000-a000-000000000001"
        path:
          type: string
          description: Canonicalized relative path under notes/ (NFC + lowercase per DATA-11)
          example: "scratchpad.md"
        content:
          type: string
          description: Raw markdown content of the note
        updated_at:
          type: string
          format: date-time
          description: Wall-clock UTC time of the last successful write
    UpdateNoteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: New raw markdown content; replaces the entire file
    UpdateNoteResponse:
      type: object
      required: [id, path, updated_at]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        updated_at:
          type: string
          format: date-time
    NoteSummary:
      type: object
      required: [id, path, title, updated_at]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
          example: "scratchpad.md"
        title:
          type: string
          description: First-H1 title or filename without `.md`; never empty
          example: "Welcome to Jasper"
        updated_at:
          type: string
          format: date-time
          description: Wall-clock UTC of last filesystem mtime observed by the indexer
    NoteList:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSummary"
    MigrationStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: |
            Current migration runner state. Surfaces the three-path resilience
            model from DESIGN.md §4.4.
              - "ok"            — schema is current; no action required
              - "rolled_back"   — Path 1 fired; previous schema active; banner shown (UX-03)
              - "rebuilding"    — Path 2 in progress; UI shows ReindexProgress overlay
              - "unrecoverable" — Path 3 fired; static error page is served and the SPA cannot reach this endpoint (documented for future use)
          enum: [ok, rolled_back, rebuilding, unrecoverable]
        failed_migration:
          type: string
          description: Filename of the migration that triggered Path 1 (only set when state=rolled_back)
          example: "003_tags.sql"
        logs_path:
          type: string
          description: Absolute path to the structured log file (only set when state in {rolled_back, unrecoverable})
          example: "/Users/me/.jasper/storage/logs/jasper.log"
        notes_indexed:
          type: integer
          description: Count of rows currently in the `notes` table (informational)
          example: 1247
    ReindexRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [full, incremental]
          default: full
          description: |
            "full"        — Path 2: drop derived tables, re-run all migrations on the new (clean) schema, walk every .md file
            "incremental" — re-run the cheap mtime-based delta scan only (DATA-09)
    ReindexResponse:
      type: object
      required: [started_at]
      properties:
        started_at:
          type: string
          format: date-time
          description: Wall-clock UTC when the reindex began (Phase 2 returns AFTER it finishes; this is still the start time)
        notes_indexed:
          type: integer
          description: Count of rows in the `notes` table after the reindex completed (Phase 2 only — Phase 4 streams this via WS)
    CreateNoteRequest:
      type: object
      required: [parent_path, title]
      properties:
        parent_path:
          type: string
          description: |
            Canonical relative path under notes/ to the parent folder, or ""
            for the vault root. NFC + lowercase per DATA-11; the server
            re-canonicalizes defensively.
          example: "projects/jasper"
        title:
          type: string
          description: Note title (basename without `.md`); the server appends `.md`.
          example: "design-notes"
    MoveNoteRequest:
      type: object
      required: [new_path]
      properties:
        new_path:
          type: string
          description: New canonical relative path under notes/ (with `.md` extension).
          example: "projects/jasper/design.md"
    CreateFolderRequest:
      type: object
      required: [parent_path, name]
      properties:
        parent_path:
          type: string
          description: |
            Canonical relative path under notes/ to the parent folder, or ""
            for the vault root.
          example: "projects"
        name:
          type: string
          description: New folder basename (single path segment, no `/`).
          example: "jasper"
    MoveFolderRequest:
      type: object
      required: [old_path, new_path]
      properties:
        old_path:
          type: string
          description: Current canonical relative path under notes/ for the folder.
          example: "projects/old-name"
        new_path:
          type: string
          description: New canonical relative path under notes/ for the folder.
          example: "projects/new-name"
    FolderNode:
      type: object
      required: [kind, path, name]
      properties:
        kind:
          type: string
          enum: [folder]
          description: Discriminator value identifying this node as a folder.
        path:
          type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
          example: "projects/jasper"
        name:
          type: string
          description: Basename (last path segment).
          example: "jasper"
        children:
          type: array
          description: |
            ONLY populated when this FolderNode appears inside a Tree response.
            Empty (or omitted) when used as a standalone response (POST /folders,
            POST /folders/move).
          items:
            $ref: "#/components/schemas/TreeNode"
    NoteNode:
      type: object
      required: [kind, id, path, title, updated_at]
      properties:
        kind:
          type: string
          enum: [note]
          description: Discriminator value identifying this node as a note.
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
        title:
          type: string
          description: First-H1 title or filename without `.md`; never empty.
        updated_at:
          type: string
          format: date-time
          description: Wall-clock UTC of last filesystem mtime observed by the indexer.
    TreeNode:
      oneOf:
        - $ref: "#/components/schemas/FolderNode"
        - $ref: "#/components/schemas/NoteNode"
      discriminator:
        propertyName: kind
        mapping:
          folder: "#/components/schemas/FolderNode"
          note: "#/components/schemas/NoteNode"
    Tree:
      type: object
      required: [root]
      properties:
        root:
          type: array
          description: |
            Top-level (root) entries — children of the vault root (notes/). The
            ROOT itself is implicit; folders nest via children[].
          items:
            $ref: "#/components/schemas/TreeNode"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "not_found"
        message:
          type: string
          example: "no note with id 00000000-0000-4000-a000-000000000001"
    WSEnvelope:
      type: object
      description: |
        WebSocket event envelope (DESIGN.md §5.2). The `event` enum is
        locked verbatim and mirrors the Go const block in
        backend/internal/wshub/envelope.go and the TS dispatch table
        in frontend/src/lib/useSessionSync.ts.
      required: [event, origin_session_id, payload]
      properties:
        event:
          type: string
          enum:
            - "session:assigned"
            - "note:created"
            - "note:updated"
            - "note:deleted"
            - "note:moved"
            - "folder:created"
            - "folder:deleted"
            - "folder:moved"
            - "tags:updated"
            - "reindex:started"
            - "reindex:complete"
            - "migration:status"
        origin_session_id:
          type: string
          description: |
            UUID of the session that originated the mutation. Empty
            string for server-originated events (reindex:*,
            migration:status). Clients ignore events whose
            origin_session_id matches their own (SYNC-03 origin
            filter).
        payload:
          description: Event-specific payload; shape determined by `event`.
    WSNoteCreatedPayload:
      type: object
      required: [id, path, title, updated_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        title: { type: string }
        updated_at: { type: string, format: date-time }
    WSNoteUpdatedPayload:
      type: object
      required: [id, path, updated_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        updated_at: { type: string, format: date-time }
    WSNoteDeletedPayload:
      type: object
      required: [id, path]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
    WSNoteMovedPayload:
      type: object
      required: [id, old_path, new_path, updated_at]
      properties:
        id: { type: string, format: uuid }
        old_path: { type: string }
        new_path: { type: string }
        updated_at: { type: string, format: date-time }
    WSFolderCreatedPayload:
      type: object
      required: [path, name]
      properties:
        path: { type: string }
        name: { type: string }
    WSFolderDeletedPayload:
      type: object
      required: [path, recursive]
      properties:
        path: { type: string }
        recursive: { type: boolean }
    WSFolderMovedPayload:
      type: object
      required: [old_path, new_path]
      properties:
        old_path: { type: string }
        new_path: { type: string }
    WSReindexStartedPayload:
      type: object
      description: Empty payload — server-originated.
      properties: {}
    WSReindexCompletePayload:
      type: object
      required: [notes_indexed]
      properties:
        notes_indexed: { type: integer }
    StaleWriteError:
      type: object
      description: |
        Returned by PUT /notes/{id} when If-Match does not match the
        current file's updated_at (SYNC-06). The client surfaces
        SYNC-05's Save-anyway / Discard banner using
        current_updated_at as the new comparator.
      required: [code, message, current_updated_at]
      properties:
        code:
          type: string
          enum: [stale_write]
