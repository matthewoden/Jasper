openapi: 3.1.0
info:
  title: Jasper API
  version: 0.2.0
  description: |
    Jasper HTTP API: notes CRUD keyed by UUID, the file-tree projection,
    admin endpoints (migration status, full re-index) backing DATA-10, and
    tags, backlinks and wiki-link search-titles
    (TAGS-03, TAGS-04, TAGS-06, TAGS-07, LINKS-06, LINKS-08).

    Source of truth: every route Jasper exposes lives in this file (API-01).
    Adding a route here without a Go handler causes a compile error
    under oapi-codegen StrictServerInterface (API-02).
servers:
  - url: /api/v1
    description: Same-origin (Go binary or Vite dev proxy)
tags:
  - { name: notes, description: "Note read and write operations" }
  - { name: admin, description: "Operational endpoints — migration status, full re-index" }
  - { name: tree, description: "File-tree projection over notes/ (TREE-01)" }
  - { name: folders, description: "Folder-only operations (TREE-04, TREE-05, TREE-06, TREE-07)" }
  - { name: config, description: "User configuration (DESIGN.md §11) — theme, daily notes, editor preferences" }
  - { name: tags, description: "Tag browser, rename, delete (TAGS-03, TAGS-04, TAGS-06, TAGS-07)" }
  - { name: backlinks, description: "Backlinks panel and wiki-link autocomplete (LINKS-06, LINKS-08)" }
  - { name: sharing, description: "OS file-manager integration: reveal a note path in Finder / Explorer (SHARE-01)" }
  - { name: mcp, description: "MCP write-grant ACL: per-folder grants with two-tier model (MCP-01)" }
  - { name: bookmarks, description: "Note bookmarks + bookmark folders: pin notes by UUID, group into virtual folders (BOOK-01, BOOK-03, BOOK-04)" }
  - { name: setup, description: "First-run wizard: status, data-dir validation, submit (INSTALL-07)" }
  - { name: vault, description: "Vault registry: current vault, recent vaults, open/create/forget (ADR-001, VAULT-01)" }
paths:
  /notes:
    get:
      tags: [notes]
      operationId: getNotes
      summary: List all indexed notes (metadata only)
      description: |
        List all indexed notes (metadata only — no content). Backed by the SQLite
        derived index (DATA-09). No query parameters — search and tag filtering
        live on their own endpoints.
      responses:
        "200":
          description: List of note metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
    post:
      tags: [notes]
      operationId: postNotes
      summary: Create a new note (TREE-03)
      description: |
        Create a new note under {parent_path}/{title}.md. The server canonicalizes
        the resulting path (NFC + lowercase per DATA-11) and rejects case-insensitive
        collisions per DATA-12. parent_path "" means the vault root. The created
        file is empty (zero bytes) and immediately re-indexed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSummary"
        "400":
          description: Invalid request (missing fields, illegal title chars, parent traversal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision (DATA-12) OR parent_path does not resolve to a folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/{id}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      tags: [notes]
      operationId: getNoteById
      summary: Read a note by UUID
      responses:
        "200":
          description: Note found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [notes]
      operationId: putNoteById
      summary: Replace the content of a note by UUID
      parameters:
        - name: If-Match
          in: header
          required: false
          description: |
            Optimistic concurrency comparator (SYNC-06), compared against
            the file's current mtime at RFC3339Nano precision.

            Legal values are the ones the server derived from a `stat` of
            the file: `Note.etag` (GET /notes/{id}), the `etag` of a prior
            `UpdateNoteResponse`, and the `current_updated_at` a 409 hands
            back. **Never** an `updated_at` from an index-backed payload —
            /tree, note lists, tag lists and backlinks read whole-second
            timestamps out of SQLite, so a comparator built from one can
            never match and yields a guaranteed spurious `stale_write`.

            On mismatch the server returns 409 with `code: stale_write`
            and `current_updated_at` in the body — the client surfaces
            SYNC-05's Save-anyway / Discard banner. Permissive when
            absent (curl / automation friendly). Server treats the
            value as an opaque string round-trip; max length 256 chars.
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Note updated; atomic write committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateNoteResponse"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Stale write (SYNC-06) — If-Match mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaleWriteError"
        "500":
          description: Write failure on disk (atomic-rename or fsync error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [notes]
      operationId: deleteNoteById
      summary: Delete a note by UUID (TREE-06)
      description: |
        Delete the note identified by UUID. Removes the underlying `.md` file
        atomically and clears the SQLite index row in the same write transaction.
        404 when the UUID is unknown; 500 when the FS / SQLite operation fails
        and the two stores would be left inconsistent.
      responses:
        "204":
          description: Deleted
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Delete failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/{id}/move:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    post:
      tags: [notes]
      operationId: postNoteMove
      summary: Rename or move a note (TREE-05, TREE-07)
      description: |
        Rename and/or move a note in a single atomic transaction. new_path is a
        canonical relative path under notes/; the server NFC-lowercases it before
        applying. Wiki-link references are rewritten vault-wide (LINKS-07) and the
        SQLite index row is updated. Returns the post-move
        NoteSummary so the client can reconcile against any server-side path
        normalization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveNoteRequest"
      responses:
        "200":
          description: Move committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveNoteResponse"
        "400":
          description: Invalid request (empty new_path, illegal chars, ".." escape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision with an existing note (DATA-12)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Move failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /attachments/{noteId}:
    post:
      tags: [notes]
      operationId: createAttachment
      summary: Upload an attachment to a note's attachments/ directory (ATTACH-01..04).
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Attachment stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentUploadResult" }
        "404":
          description: Note not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: File exceeds the 100 MB upload cap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /attachments/{noteId}/{filename}:
    get:
      tags: [notes]
      operationId: getAttachment
      summary: Stream an attachment file (ATTACH-05/06; path-traversal hardened).
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Binary stream with Content-Type header.
          content:
            application/octet-stream: {}
        "400":
          description: Invalid filename (path traversal attempt).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Symlink rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Attachment not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /files:
    post:
      tags: [notes]
      operationId: createFile
      summary: Upload an OS file into the notes/ tree at the specified directory.
      description: |
        Multipart upload landing under <dataDir>/notes/<path>. Used by the
        sidebar tree's OS-file drop target — drop on a folder row → file lands
        inside that folder; drop on a note/file → file lands as sibling; drop
        on empty area → file lands at vault root.

        path is passed as a query parameter (mirroring DELETE /folders and the
        sibling GET /files endpoint) because OpenAPI 3.1 has no
        native multi-segment path-wildcard syntax and oapi-codegen does not
        emit chi `*` catch-all routes. Co-locating GET + POST at /files keeps
        the surface coherent: same wire shape for both verbs.

        Refuses .md uploads (markdown bodies must be created via POST /notes).
        Reuses generateUniqueFilename for collision-safe naming.
        Enforces the 100 MB upload cap. Same 5-rule path-traversal
        pipeline as GET /files plus a Lstat that ensures the
        target is a directory (NO auto-mkdir — the user creates folders via
        the existing tree UI before dropping).
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: |
            Target DIRECTORY (relative to notes/). "" = vault root.
            "gallery" = notes/gallery/. "gallery/sub" = notes/gallery/sub/.
            Must not contain `..` segments or absolute path prefixes;
            must point to an existing directory (returns 400 otherwise).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File uploaded; returns relative path + final filename.
          content:
            application/json:
              schema:
                type: object
                required: [path, name, size_bytes]
                properties:
                  path:
                    type: string
                    description: Relative path under notes/ (e.g. "gallery/photo-1.png").
                  name:
                    type: string
                    description: Final filename after collision-safe rename.
                  size_bytes:
                    type: integer
                    format: int64
                  content_type:
                    type: string
                    description: MIME sniff of the uploaded bytes.
        "400":
          description: Invalid path / filename / target dir does not exist / .md upload refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Symlink rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: File too large (>100 MB).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [notes]
      operationId: getFile
      summary: Stream any file under the notes vault by relative path.
      description: |
        Generic file streamer. Returns ANY file located under <dataDir>/notes/<path>
        without requiring a note context. Used by the sidebar tree's file-click
        handler when the user selects a non-markdown file (image attachments,
        PDFs, etc.). Returns 404 for .md files (use /notes/{id} instead).

        path is passed as a query parameter (mirroring DELETE /folders) because
        OpenAPI 3.1 has no native multi-segment path-wildcard syntax and
        oapi-codegen does not emit chi `*` catch-all routes. The query-param
        approach handles slash-containing relative paths cleanly while keeping
        the route inside the generated StrictServerInterface.

        **The generated handler for this route is a stub and is unreachable.**
        app.go and lifecycle.go mount `api.Server.ServeFile` AFTER
        `api.HandlerFromMux`, so it wins under chi's last-registration-wins —
        the same arrangement `/ws` uses. The path stays in this spec so every
        HTTP route the server answers is described here.

        The hand-mounted handler exists because the generated response type can
        set only Content-Type and Content-Length, and hard-codes the former to
        `application/octet-stream`. The live route needs neither value:

        - **Content-Type is sniffed** via http.DetectContentType, with an
          explicit `image/svg+xml` override for `.svg` — DetectContentType
          returns `text/xml` for SVG, which browsers refuse to render in `<img>`.
        - **Content-Disposition** is `inline` for an allowlist of media types
          (images including SVG, audio, video, PDF) and `attachment` for
          everything else, so a planted `.html` or `.xhtml` cannot be navigated
          to as a live document.
        - **Content-Security-Policy** is `default-src 'none'; sandbox` on every
          response, alongside `X-Content-Type-Options: nosniff`. Files are
          served from the app's own origin, so without this an SVG containing
          `<script>`, opened as a top-level document, would execute with full
          same-origin API access to every note. `sandbox` loads it into an
          opaque origin with scripting disabled; it does not affect subresource
          loads, so images embedded in notes still render.

        Containment: the path is resolved through `fsstore.ResolveContained`,
        which decides containment before stat'ing the leaf, so a path escaping
        the vault via a symlinked ancestor is rejected identically whether or
        not the target exists.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: |
            Canonical relative path under notes/ (e.g. "attachments/photo.png",
            "gallery/attachments/note.pdf"). Must not contain `..` segments or
            absolute path prefixes (validated server-side).
      responses:
        "200":
          description: |
            Binary stream. The declared `application/octet-stream` reflects the
            generated stub, NOT the live handler, which sends a sniffed media
            type plus Content-Disposition and the raw-file security headers
            described above. oapi-codegen has no way to express "whatever the
            handler decides"; treat the description as authoritative here.
          content:
            application/octet-stream: {}
        "400":
          description: Invalid path (path traversal attempt or absolute path).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Symlink rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: File not found OR path is a .md file (use /notes/{id}).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [notes]
      operationId: deleteFile
      summary: Delete a non-markdown file under notes/.
      description: |
        Mirrors GetFile's path-traversal pipeline. Refuses .md (those are notes —
        use DELETE /notes/{id}). Refuses directories (use DELETE /folders). Single
        os.Remove call once the path resolves under notes/.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Canonical relative path under notes/ (e.g. "attachments/photo.png").
      responses:
        "204":
          description: File deleted.
        "400":
          description: Invalid path / .md path refused / target is a directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Symlink rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: File not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /files/move:
    post:
      tags: [notes]
      operationId: postFileMove
      summary: Rename / move a non-markdown file under notes/.
      description: |
        Mirrors POST /folders/move for non-markdown files. Both src_path and
        dst_path are relative under notes/; both run through the 5-rule
        path-traversal pipeline. Refuses .md (those go through POST /notes/{id}/move).
        Refuses overwrite (409 if dst already exists). Atomic os.Rename on POSIX
        same-filesystem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [src_path, dst_path]
              properties:
                src_path:
                  type: string
                  description: Existing relative path under notes/.
                dst_path:
                  type: string
                  description: Target relative path under notes/.
      responses:
        "200":
          description: Move committed; returns the new path.
          content:
            application/json:
              schema:
                type: object
                required: [path, name]
                properties:
                  path:
                    type: string
                  name:
                    type: string
        "400":
          description: Invalid src/dst path / .md path refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Symlink rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Source file not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Destination already exists (refuses overwrite).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /daily-notes/{date}:
    get:
      tags: [notes]
      operationId: getDailyNote
      summary: Read the daily note for a date (DAILY-01..03).
      description: >-
        Read-only. Returns 404 when no daily note exists for the date;
        creation is POST to this same path.

        This endpoint used to get-or-create, which made a cross-origin
        `<img src="http://127.0.0.1:6683/api/v1/daily-notes/2099-12-31">`
        on any page the user visited write a file into the vault. GET is a
        safe method, so csrfOriginMiddleware never inspects it, and the Host
        allowlist does not help either — such a request carries a genuinely
        loopback Host. Splitting the verb is the fix; no GET endpoint mutates
        the filesystem.
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Daily note exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteDetail" }
        "400":
          description: Invalid date format.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No daily note exists for this date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [notes]
      operationId: createDailyNote
      summary: Create the daily note for a date from the configured template.
      description: >-
        Idempotent get-or-create. Returns 201 when the note is created and
        200 when it already existed. Being a POST, it is covered by the
        Origin guard, which is the point of the split.
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Daily note already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteDetail" }
        "201":
          description: Daily note created from template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteDetail" }
        "400":
          description: Invalid date format.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /search:
    get:
      tags: [notes]
      operationId: searchNotes
      summary: FTS5 full-text search over note bodies and tag values (SEARCH-01..04).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: tag
          in: query
          required: false
          description: >-
            AND-combine with one or more tag filters. May be repeated
            (?tag=a&tag=b) to require all listed tags; capped at 8 tags.
          schema: { type: array, items: { type: string } }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          required: false
          description: >-
            Result ordering (SORT-02). "relevance" (default) is the existing
            bm25 + recency blend; "modified"/"created" order the full match
            set by the respective timestamp DESC before the limit is applied
            — not a client reshuffle of the relevance results.
          schema:
            type: string
            enum: [relevance, modified, created]
            default: relevance
      responses:
        "200":
          description: Result list (empty array when no matches).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "400":
          description: Invalid FTS5 query syntax, or an unrecognized sort value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /tree:
    get:
      tags: [tree]
      operationId: getTree
      summary: Return the full folder/file hierarchy under notes/ (TREE-01)
      description: |
        Returns one nested tree document for the entire vault. The shape is a
        tagged union — TreeNode is either {kind:"folder", path, name, children[]}
        or {kind:"note", id, path, title, updated_at}. Sort order: alphabetical
        by name within each level, folders before notes. Used by the sidebar
        FileTree (react-arborist).
      responses:
        "200":
          description: Full tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"
        "500":
          description: Tree projection failed (FS walk / SQLite error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /folders:
    post:
      tags: [folders]
      operationId: postFolders
      summary: Create a folder (TREE-04)
      description: |
        Create an empty folder under {parent_path}/{name}. The server
        canonicalizes the resulting path (NFC + lowercase per DATA-11) and
        rejects case-insensitive collisions. parent_path "" means the vault
        root. Folders are pure FS constructs — there is no `folders` table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderNode"
        "400":
          description: Invalid request (empty name, illegal chars, parent traversal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision OR parent_path does not resolve to a folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [folders]
      operationId: deleteFolder
      summary: Delete a folder (TREE-06) — non-empty requires recursive=true
      description: |
        Delete the folder at the given canonical path. By default (recursive=false)
        the server returns 409 folder_not_empty if the folder has any children.
        The client's Delete-folder dialog always sets recursive=true after the
        user confirms the content-count copy. Path is
        passed as a query parameter so URL-encoding handles `/` separators
        cleanly — folders have no SQLite identity and so cannot be addressed by
        UUID.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
        - name: recursive
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            When false (default), the server returns 409 folder_not_empty if the
            folder has any children. The client's Delete-folder dialog always
            sets recursive=true after the user confirms the content-count copy.
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid request (missing path, ".." escape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Folder not empty (recursive=false and folder has children)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Delete failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /folders/move:
    post:
      tags: [folders]
      operationId: postFolderMove
      summary: Rename or move a folder (TREE-05, TREE-07)
      description: |
        Atomically renames/moves a folder and re-canonicalizes every contained
        note's path under the new prefix. Implementation note: folders are pure
        FS constructs — there is no `folders` table — so the SQLite update is a
        batch UPDATE notes SET path=... WHERE path LIKE 'old_prefix/%' inside one
        BEGIN IMMEDIATE transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFolderRequest"
      responses:
        "200":
          description: Move committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderNode"
        "400":
          description: Invalid request (empty paths, illegal chars, ".." escape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: old_path does not resolve to a folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision with an existing folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Move failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags:
    get:
      tags: [tags]
      operationId: getTags
      summary: List all tags with note counts (TAGS-03)
      description: |
        Returns all tags present in the vault, sorted alphabetically by name.
        Each entry includes the normalized tag name (lowercase [a-z0-9_-]+)
        and the count of notes carrying that tag. Feeds the sidebar tag browser
        and the tag autocomplete source.
        Empty array on empty vault or when no notes have tags.
      responses:
        "200":
          description: Alphabetical list of tags with note counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
  /tags/{name}:
    parameters:
      - $ref: "#/components/parameters/TagName"
    put:
      tags: [tags]
      operationId: putTag
      summary: Rename a tag across all notes (TAGS-06)
      description: |
        Rename an existing tag in a single backend transaction. Rewrites the
        `tags:` frontmatter array in every note carrying the tag. Returns the
        list of affected note IDs so the client can refresh stale UI rows.
        Emits a `tags:rewritten` WebSocket batch event.
        Returns 400 if new_name fails charset validation;
        404 if the old tag does not exist;
        409 if new_name collides with an existing tag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRenameRequest"
      responses:
        "200":
          description: Tag renamed; frontmatter rewritten across all carrying notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRenameResponse"
        "400":
          description: "new_name fails charset validation (^[a-z0-9_-]+$)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Tag not found (old name does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: new_name collides with an existing tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Rewrite failed (disk or transaction error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [tags]
      operationId: deleteTag
      summary: Remove a tag from all notes (TAGS-07)
      description: |
        Remove an existing tag from the `tags:` frontmatter array in every note
        carrying it, in a single transaction. The tag row is deleted after all
        frontmatter rewrites commit. Returns the list of affected note IDs so
        the client can refresh stale UI rows. Emits a `tags:rewritten` WebSocket
        batch event with new_name=null to indicate deletion.
        Returns 404 if the tag does not exist.
      responses:
        "200":
          description: Tag removed; frontmatter rewritten across all carrying notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDeleteResponse"
        "404":
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Rewrite failed (disk or transaction error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags/{name}/notes:
    parameters:
      - $ref: "#/components/parameters/TagName"
    get:
      tags: [tags]
      operationId: getTagNotes
      summary: List notes carrying a specific tag (TAGS-04)
      description: |
        Returns a flat list of notes that carry the given normalized tag name.
        Results are sorted by note updated_at descending (most-recent first)
        consistent with the tree sidebar's default sort.
        Returns 404 if the tag does not exist in the vault.
      responses:
        "200":
          description: Flat list of notes carrying this tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "404":
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/{id}/backlinks:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      tags: [backlinks]
      operationId: getNoteBacklinks
      summary: List notes that link to this note (LINKS-08)
      description: |
        Returns resolved backlinks — notes containing `[[Title]]` references
        that resolve to the note identified by `id`. Pending (unresolved) links
        are not included. Rows are sorted by source note updated_at
        descending (most-recently-edited source first).
        The `excerpt` field is server-built HTML safe for the DOMPurify
        allowlist: `<span>...<mark class="backlink-ref">[[Title]]</mark>...</span>`.
      responses:
        "200":
          description: List of resolved backlinks for this note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinksResponse"
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/search-titles:
    get:
      tags: [backlinks]
      operationId: getNotesSearchTitles
      summary: Search note titles for wiki-link autocomplete (LINKS-06)
      description: |
        Full-text prefix search over note titles for the `[[` autocomplete popup.
        Empty `q` returns the most-recently-edited notes up to `limit`.
        Results are ranked by recency (60%) + proximity (40%).
        `limit` is capped at 50 as a DoS mitigation.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            default: ""
          description: |
            Prefix search string. Empty string (default) returns the most-recent
            notes by last-edit time. Case-insensitive, NFC-normalized.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          description: Maximum number of results to return (default 10, max 50).
      responses:
        "200":
          description: Ranked list of matching note titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSearchResponse"
  /admin/status:
    get:
      tags: [admin]
      operationId: getAdminStatus
      summary: Report the migration runner state
      description: |
        Returns the migration runner state that backs the client's migration
        banner. The frontend `useMigrationStatus()` hook polls this on mount.
      responses:
        "200":
          description: Current migration runner state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationStatus"
  /config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read user configuration
      description: |
        Returns the current config.json contents (DESIGN.md §11). Fields the
        UI does not surface still ship with sensible defaults.
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
    put:
      tags: [config]
      operationId: putConfig
      summary: Replace user configuration (whole-document)
      description: |
        Writes config.json atomically via fsstore.AtomicWrite
        (DATA-13: temp + fsync + rename + fsync(parent)).
        Strict decode: unknown fields → 400 invalid_request.
        Replaces the whole document — retained for whole-document writes
        (per-section Reset, first-run fixtures). For partial writes that
        should leave every other field untouched, use PATCH /config.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Config" }
      responses:
        "200":
          description: Config saved; echoes the persisted document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
        "400":
          description: Invalid request (malformed body, unknown field, out-of-range numeric)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Save failed (filesystem error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [config]
      operationId: patchConfig
      summary: Partially update user configuration
      description: |
        Writes only the keys present in the request body via
        config.SaveMergedPartial; fields absent from the body are left
        untouched on disk (including unmanaged/hand-added keys). Writes
        are serialised server-side so concurrent PATCH/PUT requests never
        lose an update. Strict decode: unknown fields → 400 invalid_request,
        same as PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigPatch" }
      responses:
        "200":
          description: Config saved; echoes the full persisted document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
        "400":
          description: Invalid request (malformed body, unknown field, out-of-range numeric)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Save failed (filesystem error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /ws:
    get:
      tags: [ws]
      operationId: getApiV1Ws
      summary: WebSocket endpoint (HTTP/1.1 Upgrade)
      description: |
        Server-broadcast WebSocket. Client opens with
        `?session_id=<uuid>` query parameter — the client, not the server,
        is authoritative for the session id. Server responds with a
        `session:assigned` envelope confirming the id, then streams
        events until disconnect.

        oapi-codegen generates a stub handler for this route which is
        unreachable: lifecycle.go mounts `/ws` via wshub.Hub.ServeHTTP
        BEFORE api.HandlerFromMux. The path exists in the spec to satisfy
        API-01 ("every HTTP route in the spec").

        Origin enforcement: the Accept call in wshub.Hub.ServeHTTP sets
        OriginPatterns: ["localhost:*", "127.0.0.1:*"]. The OpenAPI spec
        does NOT and CANNOT enforce origin — that is a runtime control on
        the upgrade handshake.
      x-jasper-websocket: true
      parameters:
        - name: session_id
          in: query
          required: false
          description: |
            Per-tab UUID generated by the client (sessionStorage).
            Server adopts this as the connection's session_id; the
            handshake message echoes it for confirmation. Treated as
            opaque; max length 128 chars enforced in middleware.
          schema:
            type: string
            format: uuid
            maxLength: 128
      responses:
        "101":
          description: Switching protocols (WebSocket upgrade)
        "400":
          description: Not a WebSocket request
  /admin/reindex:
    post:
      tags: [admin]
      operationId: postAdminReindex
      summary: Trigger a full or incremental re-index
      description: |
        Backs DATA-10: drop the derived tables, re-run migrations on a clean
        schema, and walk every `.md` file. Runs synchronously and returns 202
        only after the rebuild finishes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexRequest"
      responses:
        "202":
          description: Re-index accepted; the response is sent after completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexResponse"
        "409":
          description: A re-index is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Database is in unrecoverable state (Path 3 fired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reveal:
    post:
      tags: [sharing]
      operationId: postReveal
      summary: Reveal a note path in the host OS file manager (SHARE-01)
      description: |
        Opens the host OS file manager with the named path selected.
        macOS uses `open -R <path>` (Finder reveal). WSL2 uses
        `explorer.exe /select,<windows-path>` with the WSL path translated
        to a Windows UNC path. Linux-native is not a v1 target — handler
        returns 501.

        The `path` field is the path under the vault, relative to
        notes/. The handler resolves it through the same
        canonicalization used by GET /notes (DATA-11) to prevent
        traversal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealRequest"
      responses:
        "200":
          description: File manager launched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealResponse"
        "400":
          description: Invalid path (traversal, empty, outside vault)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: File manager exec failed (system error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not supported on this platform (e.g. Linux native)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mcp/grants:
    get:
      tags: [mcp]
      operationId: getMcpGrants
      summary: List all MCP write grants (MCP-01)
      description: |
        Returns every row in the mcp_write_grants table (migration 004).
        The frontend tree menu reads this list to render "MCP write"
        indicators per folder. Folders without a row are deny-by-default;
        grants at an ancestor folder grant writes recursively, resolved
        server-side at write time.
      responses:
        "200":
          description: All MCP write grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpGrantList"
    post:
      tags: [mcp]
      operationId: postMcpGrant
      summary: Grant (or upgrade) MCP write access for a folder (MCP-01)
      description: |
        Idempotent grant for `folder_path` at `level` (1 = create+update;
        2 = create+update+move+delete). If the folder already has a row,
        the level is updated to the requested value (upgrade or
        downgrade); `granted_at` is refreshed; `granted_via` updates to
        reflect the new entry point. Broadcasts `mcp:grant_changed` on
        the WS hub so every connected tab refreshes its indicators.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpGrantRequest"
      responses:
        "200":
          description: Grant created or upgraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpGrant"
        "400":
          description: Invalid path or level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [mcp]
      operationId: deleteMcpGrant
      summary: Revoke MCP write access for a folder (MCP-01)
      description: |
        Deletes the grant row for `folder_path`. Does NOT recurse —
        ancestor grants still apply. Broadcasts
        `mcp:grant_changed` on success.
      parameters:
        - name: path
          in: query
          required: true
          description: folder_path of the grant to revoke (canonical NFC+lowercase).
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: Grant deleted
        "404":
          description: No grant exists for that folder_path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bookmarks:
    get:
      tags: [bookmarks]
      operationId: getBookmarks
      summary: Read the whole bookmarks document (folders + bookmarks, auto-pruned) (BOOK-01)
      description: |
        Returns every bookmark folder and bookmark row persisted in
        <vault>/.jasper/bookmarks.json. Bookmarks whose noteId no longer
        resolves in the notes registry are silently dropped before this
        response is built (prune-on-read, BOOK-04) — the frontend
        never sees a bookmark pointing at a deleted note.
      responses:
        "200":
          description: Bookmarks document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarksDocument"
    post:
      tags: [bookmarks]
      operationId: postBookmark
      summary: Bookmark a note by UUID, optionally into a folder (BOOK-01, BOOK-03)
      description: |
        Adds a new bookmark row for note_id. Rejects an unknown/forged
        note_id with 404 — validated against the notes registry, not
        trusted client input. Rejects an unknown folder_id with 400.
        Broadcasts `bookmark:changed` on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkCreateRequest"
      responses:
        "201":
          description: Bookmark created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"
        "400":
          description: Unknown folder_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown or forged note_id (not present in the notes registry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bookmarks/{id}:
    parameters:
      - $ref: "#/components/parameters/BookmarkId"
    delete:
      tags: [bookmarks]
      operationId: deleteBookmark
      summary: Remove a bookmark by id (BOOK-01)
      description: |
        Deletes the bookmark row matching id. Broadcasts `bookmark:changed`
        on success.
      responses:
        "204":
          description: Bookmark deleted
        "404":
          description: Unknown bookmark id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bookmarks/{id}/folder:
    parameters:
      - $ref: "#/components/parameters/BookmarkId"
    post:
      tags: [bookmarks]
      operationId: moveBookmark
      summary: Move a bookmark into a folder, or to top-level when folder_id is null (BOOK-03)
      description: |
        Sets the bookmark's folder_id. A null folder_id moves the
        bookmark back to the top level (ungrouped). Rejects an unknown
        bookmark id with 404 and an unknown folder_id with 400.
        Broadcasts `bookmark:changed` on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkMoveRequest"
      responses:
        "200":
          description: Bookmark moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkMoveResponse"
        "400":
          description: Unknown folder_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown bookmark id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bookmarks/reorder:
    post:
      tags: [bookmarks]
      operationId: reorderBookmarks
      summary: Set explicit display order for every bookmark in one folder scope (BOOK-03, drag-to-reorder)
      description: |
        Given the FULL ordered list of bookmark ids for one folder scope
        (folder_id null = top-level), assigns order = index for each and
        persists. ordered_ids must be EXACTLY the current membership of
        that folder scope — a missing id, an extra id, or a foreign id
        is rejected wholesale with 404 and no partial write — the same
        forged-id posture as postBookmark. An unknown folder_id is
        rejected with 400. Broadcasts
        `bookmark:changed` on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkReorderRequest"
      responses:
        "204":
          description: Order persisted
        "400":
          description: Unknown folder_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: ordered_ids is not exactly the current membership of the folder scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bookmark-folders:
    post:
      tags: [bookmarks]
      operationId: createBookmarkFolder
      summary: Create a new bookmark folder (virtual grouping label) (BOOK-03)
      description: |
        Creates a new bookmark folder with the given name. name is
        trimmed server-side; empty/whitespace-only names are rejected
        with 400. Bookmark folders are virtual labels, not filesystem
        folders — no filesystem-legal-character validation applies.
        A name that matches an existing folder's, compared case-
        insensitively after NFC normalization, is rejected with 409.
        Broadcasts `bookmark:changed` on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkFolderCreateRequest"
      responses:
        "201":
          description: Bookmark folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkFolder"
        "400":
          description: Invalid (empty/whitespace) name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A folder with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bookmark-folders/{id}:
    parameters:
      - $ref: "#/components/parameters/BookmarkFolderId"
    put:
      tags: [bookmarks]
      operationId: renameBookmarkFolder
      summary: Rename a bookmark folder (BOOK-03)
      description: |
        Replaces the folder's display name. name is trimmed server-side;
        empty/whitespace-only names are rejected with 400. A name that
        matches ANOTHER folder's, compared case-insensitively after NFC
        normalization, is rejected with 409 — a folder is never its own
        duplicate, so recasing a folder's own name is allowed.
        Broadcasts `bookmark:changed` on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkFolderRenameRequest"
      responses:
        "200":
          description: Bookmark folder renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkFolder"
        "400":
          description: Invalid (empty/whitespace) name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown bookmark folder id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A folder with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: First-run wizard status (INSTALL-07)
      description: |
        Returns whether the first-run wizard still needs to run.
        `first_run = true` when no resolved `cfg.Server.DataDir` is
        present (the user has not yet completed the wizard). The
        frontend redirects to /setup when this returns true.
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup/validate-data-dir:
    post:
      tags: [setup]
      operationId: postSetupValidateDataDir
      summary: Debounced wizard-side validation of a proposed data directory
      description: |
        Called by the wizard as the user types a data-directory path.
        Validates: parent exists, path is not nested inside an existing
        vault, path is writable, path contains only ASCII characters.
        Returns a structured `code` so the wizard can render an inline
        error message. Does NOT persist anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupValidateRequest"
      responses:
        "200":
          description: Validation result (valid OR invalid with code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupValidateResponse"
  /setup:
    post:
      tags: [setup]
      operationId: postSetup
      summary: Submit the first-run wizard (INSTALL-07)
      description: |
        Persists the wizard payload: writes <vault>/.jasper/config.json
        with the wizard-supplied theme, MCP grants, and daily-notes
        template, then runs migrations against the new
        data dir. On success the frontend redirects to /. Only callable
        when `GET /setup/status` returns `first_run: true` — repeat calls
        are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Setup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
        "400":
          description: Invalid request (bad path, malformed body, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Setup failed (filesystem error, migration failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vault/current:
    get:
      tags: [vault]
      operationId: getVaultCurrent
      summary: Get the currently open vault (or null if none)
      description: |
        Returns the RecentVaultEntry for the current_vault from app.json,
        or null when no vault is open (no-vault state per ADR-001 §2).
        Used by the picker UI (17c) to decide which shell to render.
      responses:
        "200":
          description: Current vault or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultCurrentResponse"
  /vault/recent:
    get:
      tags: [vault]
      operationId: getVaultRecent
      summary: Get the recent_vaults list (newest-first; missing entries included with missing=true)
      description: |
        Returns all entries from app.json's recent_vaults list sorted newest-first
        (LRU by last_opened_at). Missing entries are included with missing=true
        so the picker UI can render them with a warning badge (V11).
        The optional banner string is set by V13/V14 boot conditions.
      responses:
        "200":
          description: List of recent vaults plus optional banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultRecentResponse"
  /vault/open:
    post:
      tags: [vault]
      operationId: postVaultOpen
      summary: Open an existing vault (must already contain a .jasper/ directory)
      description: |
        Opens an existing vault folder that already has a .jasper/ directory.
        Canonicalizes the path, verifies .jasper/ exists, updates app.json via
        TouchOpened, and transitions the app to open-vault mode.
        Returns 400 when the path is invalid or .jasper/ is missing.
        Returns 409 when a vault switch is already in progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultOpenRequest"
      responses:
        "200":
          description: Vault opened; per-vault subsystems coming up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentVaultEntry"
        "400":
          description: Invalid path (not abs, traversal, non-ASCII, etc.) or .jasper/ missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A vault switch is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vault/create:
    post:
      tags: [vault]
      operationId: postVaultCreate
      summary: Create a new vault inside a chosen folder; runs migrations; registers in recent_vaults
      description: |
        Creates a new Jasper vault inside the given folder: creates .jasper/ with
        0700 perms, writes a minimal per-vault config.json, runs migrations, and
        opens the vault. Refuses with 400 if the folder is already a vault, if the
        path is inside an existing Jasper vault (nested-vault), or if path
        validation rules fail (abs, ASCII+NFC, parent must exist).
        Returns 409 when a vault switch is already in progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultCreateRequest"
      responses:
        "200":
          description: Vault created; opened; per-vault subsystems coming up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentVaultEntry"
        "400":
          description: Invalid path; parent does not exist; nested-vault detected; folder already a vault; non-ASCII; etc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Switch already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vault/forget:
    post:
      tags: [vault]
      operationId: postVaultForget
      summary: Remove an entry from recent_vaults (idempotent; does NOT delete the vault on disk)
      description: |
        Removes the entry with the given path from recent_vaults in app.json.
        Idempotent — calling it for a path not in the list returns 200 silently.
        Does NOT delete any files or directories on disk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultForgetRequest"
      responses:
        "200":
          description: Forgotten (or wasn't in the list to begin with)
  /vault/switch:
    post:
      tags: [vault]
      operationId: postVaultSwitch
      summary: Hot-swap from the currently open vault to a target vault
      description: |
        Initiates a hot-swap: broadcasts vault.switching, drains pending writes
        (2-second cap), tears down per-vault subsystems in V6 order, opens the
        new vault, runs migrations, kicks the indexer, optionally restarts MCP,
        then broadcasts vault.switched. The SPA reloads on vault.switched.
        Returns 409 when a switch is already in progress.
        Returns 400 when the target path is invalid or missing .jasper/.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultSwitchRequest"
      responses:
        "200":
          description: Switch initiated; vault.switching has been broadcast; SPA should mount the overlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentVaultEntry"
        "400":
          description: Invalid target; .jasper/ missing; non-ASCII; etc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A switch is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSwitchInProgressResponse"
  /vault/workspace:
    get:
      tags: [vault]
      operationId: getVaultWorkspace
      summary: Read the per-vault workspace preferences document (SORT-01, SORT-02, SORT-03, TAGS-01)
      description: |
        Returns the persisted {notesSort, searchSort, rightPanel} document
        from <vault>/.jasper/workspace.json. A missing or malformed file
        falls back to zero-value defaults (empty string means "default"),
        never a 500.
      responses:
        "200":
          description: Workspace preferences document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    put:
      tags: [vault]
      operationId: putVaultWorkspace
      summary: Persist a sort/panel preference to the workspace document (SORT-01, SORT-02, SORT-03, TAGS-01)
      description: |
        Persists whichever of notesSort/searchSort/rightPanel are present
        in the body via the workspace Service (each setter loads the full
        doc, mutates only its own field, and saves — the other fields are
        left untouched). Rejects an unrecognized enum value with 400
        before touching disk. Broadcasts `workspace:changed` on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Workspace"
      responses:
        "200":
          description: Updated workspace preferences document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: Unrecognized notesSort/searchSort/rightPanel enum value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vault/about:
    get:
      tags: [vault]
      operationId: getVaultAbout
      summary: Get server-assembled vault facts for the Settings About pane (SET3-04)
      description: |
        Assembles every About-pane fact server-side in one response: vault
        name, note count, folder count, on-disk path, app version, MCP port,
        and MCP write-grant count. Degrades individual fields to their zero
        value (never 500) when a subsystem (index, MCP ACL) is nil, so tests
        and a not-yet-fully-booted server still get a 200.
      responses:
        "200":
          description: Vault facts for the About pane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultAbout"
        "500":
          description: Internal error assembling vault facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /fs/mkdir:
    post:
      tags: [fs]
      operationId: postFsMkdir
      summary: Create a directory at an absolute path (folder-picker "New folder")
      description: |
        Creates a new directory at `path` (must be absolute). Used by the
        vault picker's "New folder" affordance so the user can prep an
        empty folder for vault creation without bouncing out to Finder.

        Returns 200 on success (and when the directory already exists —
        idempotent). 400 for non-absolute paths or names that fail the
        same ASCII / NFC / no-`..` / no-`//` validation pipeline as
        `validateVaultPath`. 403 on EACCES.

        Same posture as `/fs/list`: Jasper runs as the local user on
        loopback, so this exposes nothing beyond what the user could
        `mkdir` themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FsMkdirRequest"
      responses:
        "200":
          description: Directory created (or already existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsMkdirResponse"
        "400":
          description: Invalid path (non-absolute, validation failed, or parent missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Permission denied creating the directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /fs/list:
    get:
      tags: [fs]
      operationId: getFsList
      summary: List subdirectories of an absolute path (folder picker)
      description: |
        Returns the subdirectories of the given absolute path, plus the
        canonical absolute path and the parent path (for breadcrumbs).
        Used exclusively by the vault picker's "Browse…" modal to let the
        user click through folders without typing an absolute path.

        Safety posture: Jasper runs as the local user and is bound to
        loopback, so the user already has filesystem access at their own
        privilege level — this endpoint exposes no escalation. The handler
        still:
          - Rejects non-absolute paths (400 invalid_path).
          - Canonicalizes via filepath.Abs + filepath.Clean (symlink
            resolution happens via os.ReadDir's stat per entry, NOT via
            EvalSymlinks on the parent — we don't auto-leak the link
            target if the parent itself is a symlink).
          - Returns 400 (not 404) when the path is missing so a typo
            doesn't reveal which paths exist outside the user's view.
          - Returns 403 on EACCES so the picker can surface "no permission."

        When `path` is omitted, defaults to the user's home directory.
      parameters:
        - name: path
          in: query
          required: false
          description: Absolute path to enumerate. Defaults to $HOME when omitted.
          schema:
            type: string
      responses:
        "200":
          description: Canonical path + parent + subdirectory entries (alphabetical, case-insensitive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsListResponse"
        "400":
          description: Path is not absolute, missing, or not a directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Permission denied on the requested directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/by-path:
    get:
      tags: [notes]
      operationId: getNoteByPath
      summary: Lookup a note by its relative path (deep-link fallback)
      description: |
        Deep-link fallback. Used by the `?path=<rel>` URL
        parameter when the canonical `/notes/{id}` form is not available
        (e.g. someone shares a permalink across machines and the UUIDs
        differ but the path is stable). Server canonicalizes `path` via
        the same DATA-11 rules as the rest of the API.
      parameters:
        - name: path
          in: query
          required: true
          description: Relative path under notes/, e.g. "projects/foo.md".
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Note metadata for the matched path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSummary"
        "400":
          description: Path failed validation (traversal, absolute, non-.md, or empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No note exists at that path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    NoteId:
      name: id
      in: path
      required: true
      description: UUID of the note
      schema:
        type: string
        format: uuid
    BookmarkId:
      name: id
      in: path
      required: true
      description: Opaque UUID of the bookmark row (not a note UUID).
      schema:
        type: string
        format: uuid
    BookmarkFolderId:
      name: id
      in: path
      required: true
      description: Opaque UUID of the bookmark folder.
      schema:
        type: string
        format: uuid
    TagName:
      name: name
      in: path
      required: true
      description: |
        Normalized tag name (lowercase letters, digits, hyphens, underscores only;
        pattern ^[a-z0-9_-]+$). URL-encoded when the tag contains hyphens or underscores.
      schema:
        type: string
        pattern: "^[a-z0-9_-]+$"
        minLength: 1
        maxLength: 64
  schemas:
    Note:
      type: object
      required: [id, path, content, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
          example: "00000000-0000-4000-a000-000000000001"
        path:
          type: string
          description: Canonicalized relative path under notes/ (NFC + lowercase per DATA-11)
          example: "scratchpad.md"
        content:
          type: string
          description: Raw markdown content of the note
        updated_at:
          type: string
          format: date-time
          description: Wall-clock UTC time of the last successful write
        etag:
          $ref: "#/components/schemas/NoteETag"
    UpdateNoteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: New raw markdown content; replaces the entire file
    UpdateNoteResponse:
      type: object
      required: [id, path, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        updated_at:
          type: string
          format: date-time
        etag:
          $ref: "#/components/schemas/NoteETag"
    MoveNoteResponse:
      type: object
      required: [id, path, title, updated_at, etag]
      description: |
        The post-move note. Shaped like a `NoteSummary` but stat-backed, so it
        carries an `etag`: a rename normally leaves mtime untouched, but the
        vault-wide wiki-link rewrite that follows a title change can touch the
        renamed note itself when that note links to its own old title. The
        client must adopt this token rather than assume its pre-move one
        survived.
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
        title:
          type: string
          description: First-H1 title or filename without `.md`; never empty
        updated_at:
          type: string
          format: date-time
          description: Wall-clock UTC of the file's mtime after the move settled
        etag:
          $ref: "#/components/schemas/NoteETag"
    NoteETag:
      type: string
      maxLength: 256
      description: |
        Opaque version token for this note — what a client sends back as
        If-Match on PUT /notes/{id}.

        Carried only by the two stat-backed responses, `Note` and
        `UpdateNoteResponse`. It is deliberately absent from `NoteSummary`
        and every list-shaped payload, because those are index-backed and
        their `updated_at` is truncated to whole seconds. Naming the token
        separately is what stops a client reaching for the nearest
        `updated_at` and getting a comparator that can never match.
      example: "2026-08-02T11:04:07.123456789Z"
    NoteSummary:
      type: object
      required: [id, path, title, updated_at]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
          example: "scratchpad.md"
        title:
          type: string
          description: First-H1 title or filename without `.md`; never empty
          example: "Welcome to Jasper"
        updated_at:
          type: string
          format: date-time
          description: |
            Wall-clock UTC of last filesystem mtime observed by the indexer.
            Index-backed and therefore truncated to whole seconds — never
            usable as an If-Match comparator. Use `Note.etag` for that.

            This is why `NoteSummary` carries no `etag`: every endpoint
            returning one reads whole seconds out of SQLite, GET
            /notes/by-path included. The omission is a decision, not a gap.
    NoteDetail:
      type: object
      required: [id, path, content, updated_at, etag]
      description: |
        Full note detail including content, returned by get-or-create endpoints
        such as GET /daily-notes/{date}.
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Canonicalized relative path under notes/ (NFC + lowercase per DATA-11)
        content:
          type: string
          description: Raw markdown content of the note
        updated_at:
          type: string
          format: date-time
          description: Wall-clock UTC time of the last successful write
        etag:
          $ref: "#/components/schemas/NoteETag"
        tags:
          type: array
          items:
            type: string
          description: Normalized tag names extracted from YAML frontmatter.
    NoteList:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSummary"
    MigrationStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: |
            Current migration runner state. Surfaces the three-path resilience
            model from DESIGN.md §4.4.
              - "ok"            — schema is current; no action required
              - "rolled_back"   — Path 1 fired; previous schema active; migration banner shown
              - "rebuilding"    — Path 2 in progress; UI shows ReindexProgress overlay
              - "unrecoverable" — Path 3 fired; static error page is served and the SPA cannot reach this endpoint (documented for future use)
          enum: [ok, rolled_back, rebuilding, unrecoverable]
        failed_migration:
          type: string
          description: Filename of the migration that triggered Path 1 (only set when state=rolled_back)
          example: "003_tags.sql"
        logs_path:
          type: string
          description: Absolute path to the structured log file (only set when state in {rolled_back, unrecoverable})
          example: "/Users/me/.jasper/.jasper/logs/jasper.log"
        notes_indexed:
          type: integer
          description: Count of rows currently in the `notes` table (informational)
          example: 1247
        mcp:
          type: object
          description: MCP listener status (port 6684); reported so the SPA can surface a banner when AI tools are unavailable.
          required: [up]
          properties:
            up:
              type: boolean
              description: Whether the MCP listener is currently bound and serving.
            reason:
              type: string
              description: "Why the listener is down, e.g. 'port 6684 in use' (only set when up=false)"
              example: "port 6684 in use"
    ReindexRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [full, incremental]
          default: full
          description: |
            "full"        — Path 2: drop derived tables, re-run all migrations on the new (clean) schema, walk every .md file
            "incremental" — re-run the cheap mtime-based delta scan only (DATA-09)
    ReindexResponse:
      type: object
      required: [started_at]
      properties:
        started_at:
          type: string
          format: date-time
          description: Wall-clock UTC when the reindex began (the response is sent AFTER it finishes; this is still the start time)
        notes_indexed:
          type: integer
          description: Count of rows in the `notes` table after the reindex completed
    CreateNoteRequest:
      type: object
      required: [parent_path, title]
      properties:
        parent_path:
          type: string
          description: |
            Canonical relative path under notes/ to the parent folder, or ""
            for the vault root. NFC + lowercase per DATA-11; the server
            re-canonicalizes defensively.
          example: "projects/jasper"
        title:
          type: string
          description: Note title (basename without `.md`); the server appends `.md`.
          example: "design-notes"
    MoveNoteRequest:
      type: object
      required: [new_path]
      properties:
        new_path:
          type: string
          description: New canonical relative path under notes/ (with `.md` extension).
          example: "projects/jasper/design.md"
    CreateFolderRequest:
      type: object
      required: [parent_path, name]
      properties:
        parent_path:
          type: string
          description: |
            Canonical relative path under notes/ to the parent folder, or ""
            for the vault root.
          example: "projects"
        name:
          type: string
          description: New folder basename (single path segment, no `/`).
          example: "jasper"
    MoveFolderRequest:
      type: object
      required: [old_path, new_path]
      properties:
        old_path:
          type: string
          description: Current canonical relative path under notes/ for the folder.
          example: "projects/old-name"
        new_path:
          type: string
          description: New canonical relative path under notes/ for the folder.
          example: "projects/new-name"
    FolderNode:
      type: object
      required: [kind, path, name]
      properties:
        kind:
          type: string
          enum: [folder]
          description: Discriminator value identifying this node as a folder.
        path:
          type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
          example: "projects/jasper"
        name:
          type: string
          description: Basename (last path segment).
          example: "jasper"
        children:
          type: array
          description: |
            ONLY populated when this FolderNode appears inside a Tree response.
            Empty (or omitted) when used as a standalone response (POST /folders,
            POST /folders/move).
          items:
            $ref: "#/components/schemas/TreeNode"
    NoteNode:
      type: object
      required: [kind, id, path, title, updated_at]
      properties:
        kind:
          type: string
          enum: [note]
          description: Discriminator value identifying this node as a note.
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
        title:
          type: string
          description: First-H1 title or filename without `.md`; never empty.
        updated_at:
          type: string
          format: date-time
          description: Wall-clock UTC of last filesystem mtime observed by the indexer.
        created:
          type: string
          format: date-time
          description: "COALESCE(NULLIF(birthtime_unix,0), created_at) — true filesystem creation time when available (SORT-01)."
    FileNode:
      type: object
      description: |
        A non-markdown file inside notes/. Surfaced in the tree response so users
        can browse attachments and other files directly from the sidebar.
        Click handling is frontend-driven (window.open + appropriate stream URL).
      required: [kind, path, name]
      properties:
        kind:
          type: string
          enum: [file]
          description: "Discriminator — always 'file'."
        path:
          type: string
          description: "Canonical relative path under notes/ (NFC + lowercased)."
        name:
          type: string
          description: "Filename (basename of path)."
        size_bytes:
          type: integer
          format: int64
          description: "File size in bytes. Optional; may be omitted for performance."
        content_type:
          type: string
          description: "MIME content type (sniffed by file-stream endpoint on demand). Optional."
    TreeNode:
      oneOf:
        - $ref: "#/components/schemas/FolderNode"
        - $ref: "#/components/schemas/NoteNode"
        - $ref: "#/components/schemas/FileNode"
      discriminator:
        propertyName: kind
        mapping:
          folder: "#/components/schemas/FolderNode"
          note: "#/components/schemas/NoteNode"
          file: "#/components/schemas/FileNode"
    Tree:
      type: object
      required: [root]
      properties:
        root:
          type: array
          description: |
            Top-level (root) entries — children of the vault root (notes/). The
            ROOT itself is implicit; folders nest via children[].
          items:
            $ref: "#/components/schemas/TreeNode"
    Config:
      type: object
      required: [appName, dailyNotes, editor, theme]
      additionalProperties: false   # strict decode — unknown keys → 400
      # The `server` and `mcp` blocks are NOT in `required` so older
      # config.json files on disk continue to load; the Go side fills
      # defaults in load.go when the blocks are absent.
      # `additionalProperties: false` still holds — PUT /config payloads
      # carrying `server` or `mcp` round-trip cleanly. PUT bodies missing
      # them are accepted (strict validator pre-fills defaults).
      properties:
        appName:
          type: string
          minLength: 1
          maxLength: 64
          default: "Jasper"
        theme:
          type: string
          enum: [dark, light]
          default: dark
        dailyNotes:
          type: object
          required: [template]
          additionalProperties: false
          properties:
            template:
              type: string
              maxLength: 1024
              default: ""
        editor:
          type: object
          required: [fontSize, lineHeight, autosaveMs]
          additionalProperties: false
          properties:
            fontSize:
              type: integer
              minimum: 8
              maximum: 32
              default: 15
            lineHeight:
              type: number
              format: double
              minimum: 1
              maximum: 3
              default: 1.6
            autosaveMs:
              type: integer
              minimum: 250
              maximum: 10000
              default: 2000
              description: |
                Autosave debounce interval in milliseconds. Replaces the
                hard-coded 2000ms constant in EditorPane.tsx.
                Read at mount; requires reload to apply.
            showProperties:
              # Toggles visibility of the properties table above the note
              # body. Optional; defaults true.
              type: boolean
              default: true
            autoPair:
              # EDIT-01 — auto-close brackets/quotes in CM6.
              type: boolean
              default: true
            foldGutter:
              # EDIT-03 — heading/list code-folding gutter.
              type: boolean
              default: true
            lineNumbers:
              # EDIT-03 — CM6 line-number gutter.
              type: boolean
              default: false
            lineWidth:
              # EDIT-04 — maximum width of the writing column, in CSS pixels.
              type: integer
              minimum: 400
              maximum: 2000
              default: 700
        accent:
          type: string
          enum: [purple, sky, green, orange]
          default: purple
          description: |
            UI accent color. Applied to interactive elements (links, buttons,
            active tab indicator). Optional — legacy configs without this key
            load with the default "purple". Coerced to "purple" on load if
            the value is not a member of the enum.
        readingFont:
          type: string
          enum: [sans, serif]
          default: sans
          description: |
            Font family used in the reading/preview surface. "sans" uses the
            system sans-serif stack; "serif" uses the system serif stack.
            Optional — legacy configs without this key load with default "sans".
            Coerced to "sans" on load if the value is not "sans" or "serif".
        server:
          # HTTP listener port + resolved data directory. Port pinned at
          # 6683 (T9 spelling of "NOTE"); the wizard does NOT expose a port
          # override (config-file edit only). DataDir is set by the
          # first-run wizard and re-read at every server boot.
          # NET-01: bind defaults to loopback; 0.0.0.0 exposes all
          # interfaces. MCP always stays loopback regardless.
          type: object
          required: [port, dataDir, bind]
          additionalProperties: false
          properties:
            port:
              type: integer
              minimum: 1
              maximum: 65535
              default: 6683
            dataDir:
              type: string
              minLength: 1
            bind:
              type: string
              default: "127.0.0.1"
              description: |
                HTTP listener bind address. Defaults to "127.0.0.1" (loopback-only).
                Set to "0.0.0.0" to expose on all network interfaces. Requires a
                server restart. MCP always remains loopback regardless of this value.
        mcp:
          # The MCP listener always starts on boot; there is no
          # enable/disable toggle. AI write access is governed solely by
          # per-folder write grants. Port pinned at 6684. Bind is
          # loopback-only (127.0.0.1), enforced at listener startup via
          # netbind.RequireLoopbackBind.
          type: object
          required: [port, bind]
          additionalProperties: false
          properties:
            port:
              type: integer
              minimum: 1
              maximum: 65535
              default: 6684
            bind:
              type: string
              default: "127.0.0.1"
            auditLog:
              # MCP2-02 — tool-call audit-log toggle.
              type: boolean
              default: false
        templates:
          # TPL-01 — vault-relative folder holding templates.
          type: object
          required: [folder]
          additionalProperties: false
          properties:
            folder:
              type: string
              maxLength: 64
              default: "Templates"
    ConfigPatch:
      type: object
      additionalProperties: false   # strict decode — unknown keys → 400
      description: |
        Sparse partial-update body for PATCH /config. Every property is
        optional at every nesting level (no `required` anywhere in this
        schema) — that is the entire mechanism for distinguishing "key
        omitted, leave untouched" from "key present with value 0/false/
        empty-string, write it". Only the keys present in the request body
        are written; every other key already on disk (including
        unmanaged/hand-added keys) is preserved.
      properties:
        appName:
          type: string
          minLength: 1
          maxLength: 64
        theme:
          type: string
          enum: [dark, light]
        dailyNotes:
          type: object
          additionalProperties: false
          properties:
            template:
              type: string
              maxLength: 1024
        editor:
          type: object
          additionalProperties: false
          properties:
            fontSize:
              type: integer
              minimum: 8
              maximum: 32
            lineHeight:
              type: number
              format: double
              minimum: 1
              maximum: 3
            autosaveMs:
              type: integer
              minimum: 250
              maximum: 10000
            showProperties:
              type: boolean
            autoPair:
              type: boolean
            foldGutter:
              type: boolean
            lineNumbers:
              type: boolean
            lineWidth:
              type: integer
              minimum: 400
              maximum: 2000
        accent:
          type: string
          enum: [purple, sky, green, orange]
        readingFont:
          type: string
          enum: [sans, serif]
        server:
          type: object
          additionalProperties: false
          properties:
            port:
              type: integer
              minimum: 1
              maximum: 65535
            dataDir:
              type: string
              minLength: 1
            bind:
              type: string
        mcp:
          type: object
          additionalProperties: false
          properties:
            port:
              type: integer
              minimum: 1
              maximum: 65535
            bind:
              type: string
            auditLog:
              type: boolean
        templates:
          type: object
          additionalProperties: false
          properties:
            folder:
              type: string
              maxLength: 64
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "not_found"
        message:
          type: string
          example: "no note with id 00000000-0000-4000-a000-000000000001"
    TagWithCount:
      type: object
      required: [name, count]
      description: A single tag entry with the number of notes carrying it.
      properties:
        name:
          type: string
          description: Normalized tag name (lowercase [a-z0-9_-]+)
          example: "project"
        count:
          type: integer
          minimum: 0
          description: Number of notes in the vault that carry this tag
          example: 12
    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagWithCount"
          description: All tags in the vault, sorted alphabetically by name.
    TagRenameRequest:
      type: object
      required: [new_name]
      properties:
        new_name:
          type: string
          pattern: "^[a-z0-9_-]+$"
          minLength: 1
          maxLength: 64
          description: |
            New tag name. Must match the tag charset (lowercase letters, digits,
            hyphens, underscores only). Server re-validates server-side as
            defense-in-depth.
          example: "work"
    TagRenameResponse:
      type: object
      required: [old_name, new_name, touched_note_ids]
      properties:
        old_name:
          type: string
          description: The tag name before the rename.
        new_name:
          type: string
          description: The tag name after the rename.
        touched_note_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of notes whose frontmatter was rewritten.
    TagDeleteResponse:
      type: object
      required: [old_name, touched_note_ids]
      properties:
        old_name:
          type: string
          description: The tag name that was deleted.
        touched_note_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of notes whose frontmatter was rewritten (tag removed).
    AttachmentUploadResult:
      type: object
      required: [filename, path, content_type, category, is_image, size_bytes]
      properties:
        filename:     { type: string, description: "Final stored filename (auto-renamed on collision per ATTACH-04)." }
        path:         { type: string, description: "Path relative to the note's parent directory, e.g., 'attachments/image-1.png'." }
        content_type: { type: string, description: "MIME type from http.DetectContentType." }
        category:     { type: string, enum: [image, pdf, video, audio, archive, other] }
        is_image:     { type: boolean }
        size_bytes:   { type: integer, format: int64 }
    BacklinkRow:
      type: object
      required: [source_id, source_title, source_path, excerpts]
      description: |
        A single backlink entry: a note that contains one or more `[[...]]`
        references resolving to the target note. One card per source note,
        carrying one context-line excerpt per distinct `[[...]]` mention
        line — multiple references on the SAME line collapse into a
        single excerpt for that line, but references on separate lines each
        produce their own excerpt, rendered as stacked lines within the card.
      properties:
        source_id:
          type: string
          format: uuid
          description: UUID of the note containing the `[[...]]` reference.
        source_title:
          type: string
          description: Title of the source note (first H1 or filename without .md).
        source_path:
          type: string
          description: Canonical relative path of the source note under notes/.
        excerpts:
          type: array
          items:
            type: string
          description: |
            One server-built HTML excerpt per matching `[[...]]` mention
            line, in document order. Each excerpt is safe for the DOMPurify
            allowlist: `<span>...<mark class="backlink-ref">[[Title]]</mark>...</span>`.
            Max 200 characters of visible text per excerpt. Client MUST
            sanitize EACH excerpt individually via sanitize.ts before
            setting dangerouslySetInnerHTML — never join the
            array before sanitizing.
    BacklinksResponse:
      type: object
      required: [backlinks]
      properties:
        backlinks:
          type: array
          items:
            $ref: "#/components/schemas/BacklinkRow"
          description: |
            Resolved backlinks sorted by source note updated_at descending
            (most-recently-edited source first).
    NoteSearchResult:
      type: object
      required: [id, title, recency_score]
      description: A single note-title search result for wiki-link autocomplete.
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the matching note.
        title:
          type: string
          description: Title of the matching note (first H1 or filename without .md).
        folder:
          type: string
          nullable: true
          description: |
            Containing folder path (relative under notes/, without trailing slash),
            or null for vault-root notes. Shown in autocomplete dropdown to
            disambiguate notes with the same title.
        recency_score:
          type: number
          description: |
            0.0–1.0 recency component of the ranking score (higher = more recent).
            60% weight in the combined score.
        proximity_score:
          type: number
          nullable: true
          description: |
            0.0–1.0 proximity component (same-folder boost) or null when no
            source folder context is provided. 40% weight in the combined score.
    NoteSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/NoteSearchResult"
          description: Ranked note title search results, best match first.
    WSTagsRewrittenPayload:
      type: object
      required: [old_name, touched_note_ids]
      description: |
        Broadcast payload for `tags:rewritten` events. Emitted when a tag is
        renamed (TAGS-06) or deleted (TAGS-07). When new_name is null, the tag
        was deleted. Source tab suppresses its own broadcast via the
        origin_session_id filter.
      properties:
        old_name:
          type: string
          description: The tag name before the rename/delete.
        new_name:
          type: string
          nullable: true
          description: The new tag name, or null when the tag was deleted.
        touched_note_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of notes whose frontmatter was rewritten.
    WSLinksRewrittenPayload:
      type: object
      required: [old_title, new_title, touched_note_ids]
      description: |
        Broadcast payload for `links:rewritten` events. Emitted when a note is
        renamed and its wiki-link references are rewritten vault-wide (LINKS-07).
        Source tab suppresses its own broadcast via origin_session_id.
      properties:
        old_title:
          type: string
          description: The note title before the rename.
        new_title:
          type: string
          description: The note title after the rename.
        touched_note_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of notes whose content was rewritten.
        error:
          type: boolean
          description: "True when the rewrite failed partway; the rename was rolled back and the client should surface the error banner."
    WSEnvelope:
      type: object
      description: |
        WebSocket event envelope (DESIGN.md §5.2). The `event` enum is
        locked verbatim and mirrors the Go const block in
        backend/internal/wshub/envelope.go and the TS dispatch table
        in frontend/src/lib/useSessionSync.ts.
      required: [event, origin_session_id, payload]
      properties:
        event:
          type: string
          enum:
            - "session:assigned"
            - "note:created"
            - "note:updated"
            - "note:deleted"
            - "note:moved"
            - "folder:created"
            - "folder:deleted"
            - "folder:moved"
            - "file:created"
            - "file:deleted"
            - "file:moved"
            - "tags:updated"
            - "tags:rewritten"
            - "links:rewritten"
            - "reindex:started"
            - "reindex:complete"
            - "migration:status"
            - "mcp:grant_changed"
            - "bookmark:changed"
            - "workspace:changed"
            - "vault.switching"
            - "vault.switched"
        origin_session_id:
          type: string
          description: |
            UUID of the session that originated the mutation. Empty
            string for server-originated events (reindex:*,
            migration:status). Clients ignore events whose
            origin_session_id matches their own (SYNC-03 origin
            filter).
        payload:
          description: Event-specific payload; shape determined by `event`.
    WSNoteCreatedPayload:
      type: object
      required: [id, path, title, updated_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        title: { type: string }
        updated_at: { type: string, format: date-time }
    WSNoteUpdatedPayload:
      type: object
      required: [id, path, updated_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        updated_at: { type: string, format: date-time }
    WSNoteDeletedPayload:
      type: object
      required: [id, path]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
    WSNoteMovedPayload:
      type: object
      # title is REQUIRED so receiving tabs do not need to round-trip
      # GET /tree to refresh the tree row label after a rename — the
      # broadcast carries the freshly-extracted H1 (or filename
      # fallback) directly. Service.Move re-extracts the title on
      # every move; this field exposes it on the wire.
      required: [id, old_path, new_path, updated_at, title]
      properties:
        id: { type: string, format: uuid }
        old_path: { type: string }
        new_path: { type: string }
        updated_at: { type: string, format: date-time }
        title: { type: string }
    WSFolderCreatedPayload:
      type: object
      required: [path, name]
      properties:
        path: { type: string }
        name: { type: string }
    WSFolderDeletedPayload:
      type: object
      required: [path, recursive]
      properties:
        path: { type: string }
        recursive: { type: boolean }
    WSFolderMovedPayload:
      type: object
      required: [old_path, new_path]
      properties:
        old_path: { type: string }
        new_path: { type: string }
    WSFileCreatedPayload:
      type: object
      required: [path, name]
      properties:
        path: { type: string }
        name: { type: string }
    WSFileDeletedPayload:
      type: object
      required: [path]
      properties:
        path: { type: string }
    WSFileMovedPayload:
      type: object
      required: [old_path, new_path]
      properties:
        old_path: { type: string }
        new_path: { type: string }
    WSReindexStartedPayload:
      type: object
      description: Empty payload — server-originated.
      properties: {}
    WSReindexCompletePayload:
      type: object
      required: [notes_indexed]
      properties:
        notes_indexed: { type: integer }
    SearchResult:
      type: object
      required: [id, title, path, excerpt_html, matching_tags, rank, modified_at]
      properties:
        id:            { type: string }
        title:         { type: string }
        path:          { type: string }
        excerpt_html:  { type: string, description: "Server-sanitized HTML containing <mark> tags around matched terms." }
        matching_tags: { type: array, items: { type: string } }
        rank:          { type: number, description: "bm25 + recency score; lower is better (negative floats)." }
        modified_at:   { type: string, format: date-time }
        created:
          type: string
          format: date-time
          description: "COALESCE(NULLIF(birthtime_unix,0), created_at) — true filesystem creation time when available (SORT-01)."
    SearchResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
    StaleWriteError:
      type: object
      description: |
        Returned by PUT /notes/{id} when If-Match does not match the
        current file's updated_at (SYNC-06). The client surfaces
        SYNC-05's Save-anyway / Discard banner using
        current_updated_at as the new comparator.
      required: [code, message, current_updated_at]
      properties:
        code:
          type: string
          enum: [stale_write]
        message:
          type: string
        current_updated_at:
          type: string
          format: date-time
    # ----- Reveal, MCP grants, setup wizard and deep-link schemas -----
    RevealRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          description: |-
            Vault-relative path of the file to reveal (canonical NFC+lowercase).
            Required even in vaultRoot scope (send "."); vaultRoot scope
            ignores this value entirely and never resolves client input.
        scope:
          type: string
          enum: [note, vaultRoot]
          default: note
          description: |-
            "note" (default) reveals `path` under the vault's notes/
            directory, same behavior as before this field existed.
            "vaultRoot" ignores `path` and reveals the vault's data directory
            itself — resolved entirely server-side from configuration, never
            from client input.
    RevealResponse:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
          enum: [darwin, wsl2, linux]
          description: |-
            Host platform the reveal was executed on. `darwin` opens Finder with
            the file selected (`open -R`). `wsl2` opens Explorer with the file
            selected (`explorer.exe /select,<wslpath>`). `linux` (native, not
            WSL2) opens the parent directory in the default file manager via
            `xdg-open` — `xdg-open` cannot pre-select a target file, so the
            best-effort UX is parent-directory navigation.
    McpGrant:
      type: object
      required: [folder_path, level, granted_at, granted_via]
      properties:
        folder_path:
          type: string
          minLength: 1
          description: Canonical NFC+lowercase rel path under notes/ (DATA-11).
        level:
          type: integer
          enum: [1, 2]
          description: "1 = create+update (default); 2 = create+update+move+delete."
        granted_at:
          type: string
          format: date-time
        granted_via:
          type: string
          description: "Entry point that created the grant: 'wizard' | 'tree-context-menu' | 'tree-dropdown-menu'."
    McpGrantSeed:
      type: object
      required: [folder, level]
      description: "Wizard payload form of an MCP grant (used inside SetupRequest.mcp_grants)."
      properties:
        folder:
          type: string
          minLength: 1
        level:
          type: integer
          enum: [1, 2]
    McpGrantList:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/McpGrant" }
    McpGrantRequest:
      type: object
      required: [folder_path, level]
      properties:
        folder_path:
          type: string
          minLength: 1
        level:
          type: integer
          enum: [1, 2]
    Bookmark:
      type: object
      required: [id, note_id, folder_id, order]
      description: A single pinned note (BOOK-01). Keyed by its own opaque id, not the note's UUID.
      properties:
        id:
          type: string
          format: uuid
          description: Opaque id of the bookmark row.
        note_id:
          type: string
          format: uuid
          description: UUID of the bookmarked note (survives note rename/move — BOOK-04).
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: id of the containing BookmarkFolder, or null for a top-level (ungrouped) bookmark.
        order:
          type: integer
          minimum: 0
          description: Display order among sibling bookmarks.
    BookmarkFolder:
      type: object
      required: [id, name]
      description: A virtual grouping label for bookmarks (BOOK-03) — NOT a filesystem folder.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    BookmarksDocument:
      type: object
      required: [folders, bookmarks]
      description: Whole-document read shape returned by GET /bookmarks.
      properties:
        folders:
          type: array
          items: { $ref: "#/components/schemas/BookmarkFolder" }
        bookmarks:
          type: array
          items: { $ref: "#/components/schemas/Bookmark" }
    Workspace:
      type: object
      description: |
        Per-vault workspace preferences, persisted to
        <vault>/.jasper/workspace.json (SORT-01, SORT-02, SORT-03, TAGS-01).
        All fields are optional strings; an empty/absent value means "use
        the default" rather than an explicit user choice.
      properties:
        notesSort:
          type: string
          enum:
            - ""
            - "name-asc"
            - "name-desc"
            - "modified-desc"
            - "modified-asc"
            - "created-desc"
            - "created-asc"
        searchSort:
          type: string
          enum:
            - ""
            - "relevance"
            - "modified"
            - "created"
        rightPanel:
          type: string
          enum:
            - ""
            - "outline"
            - "backlinks"
            - "tags"
        bookmarksSort:
          description: |
            Bookmarks-panel sort order. "manual" is the default and preserves
            drag-to-reorder via each Bookmark's order field; every other value
            derives from the bookmarked note's own metadata.
          type: string
          enum:
            - ""
            - "manual"
            - "name-asc"
            - "name-desc"
            - "modified-desc"
            - "modified-asc"
            - "created-desc"
            - "created-asc"
    BookmarkCreateRequest:
      type: object
      required: [note_id]
      properties:
        note_id:
          type: string
          format: uuid
          description: UUID of the note to bookmark. Validated against the notes registry server-side.
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: Optional BookmarkFolder id to file the bookmark into on creation.
    BookmarkMoveRequest:
      type: object
      required: [folder_id]
      properties:
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: Target BookmarkFolder id, or null to move the bookmark to the top level.
    BookmarkMoveResponse:
      type: object
      required: [id, folder_id]
      description: Minimal ack shape for a successful move — echoes the mutated fields.
      properties:
        id:
          type: string
          format: uuid
        folder_id:
          type: string
          format: uuid
          nullable: true
    BookmarkReorderRequest:
      type: object
      required: [folder_id, ordered_ids]
      description: |
        The FULL ordered list of bookmark ids for one folder scope.
        folder_id is a top-level field (not per-row) because order is
        scoped per folder, not global — every id in ordered_ids
        must belong to that same scope.
      properties:
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: Folder scope being reordered, or null for top-level.
        ordered_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Every bookmark id currently in folder_id's scope, in the desired display order.
    BookmarkFolderCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Display name. Trimmed server-side; empty/whitespace-only rejected with 400.
    BookmarkFolderRenameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: New display name. Trimmed server-side; empty/whitespace-only rejected with 400.
    SetupStatus:
      type: object
      required: [first_run]
      properties:
        first_run:
          type: boolean
          description: True when the first-run wizard has not yet been completed.
    SetupValidateRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
    SetupValidateResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        code:
          type: string
          enum: [parent_missing, nested_vault, unwritable, non_ascii, not_absolute]
          description: Structured error code when valid=false.
        message:
          type: string
          description: Human-readable error message when valid=false.
    SetupRequest:
      type: object
      required: [data_dir, theme, daily_template, create_today_daily_note]
      properties:
        data_dir:
          type: string
          minLength: 1
        theme:
          type: string
          enum: [dark, light]
        mcp_grants:
          type: array
          items: { $ref: "#/components/schemas/McpGrantSeed" }
        daily_template:
          type: string
          maxLength: 1024
        create_today_daily_note:
          type: boolean
        accent:
          type: string
          enum: [purple, sky, green, orange]
          default: purple
          description: |
            Wizard accent selection. Optional — NOT in required[] so omitted
            bodies fall back to the "purple" default at vault creation
            (config.Defaults). Coerced to "purple" on load if out of enum.
        readingFont:
          type: string
          enum: [sans, serif]
          default: sans
          description: |
            Wizard reading-font selection. Optional — NOT in required[] so
            omitted bodies fall back to the "sans" default at vault creation.
    SetupResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    RecentVaultEntry:
      type: object
      required: [path, display_name, last_opened_at, created_at, missing]
      description: One entry in the recent_vaults list (V9). path is always an absolute canonical path (V10).
      properties:
        path:
          type: string
          description: Absolute canonical path to the vault folder (V10).
        display_name:
          type: string
          description: Human-readable name; defaults to filepath.Base(path).
        last_opened_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp of the last open; drives LRU sort.
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp when the vault was first registered.
        missing:
          type: boolean
          description: True when os.Stat(path) failed at boot (V11); entry is shown with a warning badge.
    VaultRecentResponse:
      type: object
      required: [vaults, banner]
      properties:
        vaults:
          type: array
          items:
            $ref: "#/components/schemas/RecentVaultEntry"
          description: Recent vaults sorted newest-first by last_opened_at.
        banner:
          type: string
          description: |
            Optional banner message set by V13/V14 boot conditions.
            Empty string when no banner. Rendered in the picker UI's
            informational strip. Safe for direct display (no HTML).
    VaultOpenRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute path to the vault folder (must contain a .jasper/ directory).
          minLength: 1
    VaultCreateRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute path to the (empty or existing) folder that will become a vault.
          minLength: 1
        display_name:
          type: string
          description: Optional display name; defaults to filepath.Base(path).
        theme:
          type: string
          enum: [dark, light]
          default: dark
          description: Per-vault theme preference.
        daily_template:
          type: string
          description: Per-vault daily-note template (inherits 08-04/08-16 wizard polish in 17c).
          maxLength: 1024
    VaultCurrentResponse:
      type: object
      description: |
        Wrapper for the current vault. vault is null when no vault is open
        (no-vault state per ADR-001 §2).
      properties:
        vault:
          $ref: "#/components/schemas/RecentVaultEntry"
          description: The currently open vault, or null when no vault is open.
          nullable: true
    VaultForgetRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute canonical path of the vault entry to remove from recent_vaults.
          minLength: 1
    VaultSwitchRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute path to the target vault (must already exist with .jasper/).
          minLength: 1
    VaultSwitchInProgressResponse:
      type: object
      required: [error, current_target]
      properties:
        error:
          type: string
          enum: [vault_switch_in_progress]
        current_target:
          type: string
          description: The vault path that was being switched to when the 409 fired.
    VaultAbout:
      type: object
      required:
        [vaultName, noteCount, folderCount, path, appVersion, mcpPort, mcpGrantCount]
      description: |
        SET3-04. Server-assembled facts for the Settings
        About pane. All seven fields are required — a nil subsystem (index,
        mcpACL) degrades its field to zero rather than omitting it.
      properties:
        vaultName:
          type: string
          description: filepath.Base of the vault's on-disk data directory.
        noteCount:
          type: integer
          description: Count of indexed notes (len of the index's note-summary list); 0 when the index is nil.
        folderCount:
          type: integer
          description: Recursive count of folder nodes in the tree projection, vault root excluded; 0 when the index is nil or not an *index.Indexer.
        path:
          type: string
          description: Absolute on-disk path of the vault's data directory.
        appVersion:
          type: string
          description: The running binary's version string (internal/buildinfo.Version).
        mcpPort:
          type: integer
          description: The loaded config's mcp.port.
        mcpGrantCount:
          type: integer
          description: Count of MCP write grants; 0 when the MCP ACL is nil.
    FsMkdirRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute path of the directory to create.
          minLength: 1
    FsMkdirResponse:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Canonical absolute path of the (now-existing) directory.
    FsListEntry:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          description: Display name of the subdirectory (basename).
        path:
          type: string
          description: Absolute path of the subdirectory.
    FsListResponse:
      type: object
      required: [path, parent, entries]
      properties:
        path:
          type: string
          description: Canonical absolute path of the directory that was listed.
        parent:
          type: string
          description: |
            Absolute path of the parent directory. Empty string when path is the
            filesystem root (so the picker can hide the up-arrow / breadcrumb-back affordance).
        windows_path:
          type: string
          description: |
            Windows-form equivalent of `path` (e.g. `C:\Users\you`) when the
            server is running under WSL2 and `path` lives under /mnt/<drive>/...
            Empty string in every other case (native macOS/Linux, paths under
            /home/..., etc.). The picker renders this as the user-facing path
            when present and keeps `path` as the click-target for backend ops.
        is_vault:
          type: boolean
          description: |
            True when `path` contains a `.jasper/` directory AND that directory
            is not the Jasper app-home registry. The picker uses this to flip
            its footer from "Select this folder" to "Open Vault" so the user
            can open the existing vault instead of seeing an "already_a_vault"
            error from the create handler.
        entries:
          type: array
          description: Subdirectories of `path`, sorted case-insensitive alphabetical.
          items:
            $ref: "#/components/schemas/FsListEntry"
