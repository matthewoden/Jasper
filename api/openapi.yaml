openapi: 3.1.0
info:
  title: Jasper API
  version: 0.2.0
  description: |
    Jasper HTTP API. Phase 1 surface: a single hard-coded note keyed by UUID.
    Phase 2 adds the canonical notes-list endpoint and two admin endpoints
    (migration status, full re-index) backing UX-03 and DATA-10.
    Phase 6 adds tags, backlinks, and wiki-link search-titles endpoints
    (TAGS-03, TAGS-04, TAGS-06, TAGS-07, LINKS-06, LINKS-08).

    Source of truth: every route Jasper exposes lives in this file (API-01).
    Adding a route here without a Go handler causes a compile error
    under oapi-codegen StrictServerInterface (API-02).
servers:
  - url: /api/v1
    description: Same-origin (Go binary or Vite dev proxy)
tags:
  - { name: notes, description: "Note read and write operations" }
  - { name: admin, description: "Operational endpoints — migration status, full re-index" }
  - { name: tree, description: "File-tree projection over notes/ (TREE-01)" }
  - { name: folders, description: "Folder-only operations (TREE-04, TREE-05, TREE-06, TREE-07)" }
  - { name: config, description: "User configuration (DESIGN.md §11) — theme, daily notes, editor preferences" }
  - { name: tags, description: "Tag browser, rename, delete (TAGS-03, TAGS-04, TAGS-06, TAGS-07)" }
  - { name: backlinks, description: "Backlinks panel and wiki-link autocomplete (LINKS-06, LINKS-08)" }
  - { name: sharing, description: "OS file-manager integration: reveal a note path in Finder / Explorer (Phase 8 SHARE-01, D-26)" }
  - { name: mcp, description: "MCP write-grant ACL: per-folder grants with two-tier model (Phase 8 MCP-01, D-13, D-17)" }
  - { name: setup, description: "First-run wizard: status, data-dir validation, submit (Phase 8 INSTALL-07, D-04, D-08, D-10)" }
paths:
  /notes:
    get:
      tags: [notes]
      operationId: getNotes
      summary: List all indexed notes (metadata only)
      description: |
        List all indexed notes (metadata only — no content). Backed by the SQLite
        derived index (DATA-09). Phase 2 has no query parameters; Phase 7 will add
        `?q=` and `?tag=` for search and tag filtering.
      responses:
        "200":
          description: List of note metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
    post:
      tags: [notes]
      operationId: postNotes
      summary: Create a new note (TREE-03)
      description: |
        Create a new note under {parent_path}/{title}.md. The server canonicalizes
        the resulting path (NFC + lowercase per DATA-11) and rejects case-insensitive
        collisions per DATA-12. parent_path "" means the vault root. The created
        file is empty (zero bytes) and immediately re-indexed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSummary"
        "400":
          description: Invalid request (missing fields, illegal title chars, parent traversal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision (DATA-12) OR parent_path does not resolve to a folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/{id}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      tags: [notes]
      operationId: getNoteById
      summary: Read a note by UUID
      responses:
        "200":
          description: Note found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [notes]
      operationId: putNoteById
      summary: Replace the content of a note by UUID
      parameters:
        - name: If-Match
          in: header
          required: false
          description: |
            Optimistic concurrency comparator (SYNC-06). When present,
            the server compares this value against the file's current
            updated_at (RFC3339Nano UTC). On mismatch the server
            returns 409 with `code: stale_write` and
            `current_updated_at` in the body — the client surfaces
            SYNC-05's Save-anyway / Discard banner. Permissive when
            absent (curl / automation friendly). Server treats the
            value as an opaque string round-trip; max length 256 chars.
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Note updated; atomic write committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateNoteResponse"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Stale write (SYNC-06) — If-Match mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaleWriteError"
        "500":
          description: Write failure on disk (atomic-rename or fsync error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [notes]
      operationId: deleteNoteById
      summary: Delete a note by UUID (TREE-06)
      description: |
        Delete the note identified by UUID. Removes the underlying `.md` file
        atomically and clears the SQLite index row in the same write transaction.
        404 when the UUID is unknown; 500 when the FS / SQLite operation fails
        and the two stores would be left inconsistent.
      responses:
        "204":
          description: Deleted
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Delete failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/{id}/move:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    post:
      tags: [notes]
      operationId: postNoteMove
      summary: Rename or move a note (TREE-05, TREE-07)
      description: |
        Rename and/or move a note in a single atomic transaction. new_path is a
        canonical relative path under notes/; the server NFC-lowercases it before
        applying. Wiki-link rewrite (LINKS-07) is DEFERRED to Phase 6 — Phase 3 only
        updates the file location and the SQLite index row. Returns the post-move
        NoteSummary so the client can reconcile against any server-side path
        normalization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveNoteRequest"
      responses:
        "200":
          description: Move committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSummary"
        "400":
          description: Invalid request (empty new_path, illegal chars, ".." escape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision with an existing note (DATA-12)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Move failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /attachments/{noteId}:
    post:
      tags: [notes]
      operationId: createAttachment
      summary: Upload an attachment to a note's attachments/ directory (ATTACH-01..04).
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Attachment stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentUploadResult" }
        "404":
          description: Note not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: File exceeds 100 MB cap (D-29).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /attachments/{noteId}/{filename}:
    get:
      tags: [notes]
      operationId: getAttachment
      summary: Stream an attachment file (ATTACH-05/06; path-traversal hardened).
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Binary stream with Content-Type header.
          content:
            application/octet-stream: {}
        "400":
          description: Invalid filename (path traversal attempt).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Symlink rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Attachment not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /files:
    post:
      tags: [notes]
      operationId: createFile
      summary: Upload an OS file into the notes/ tree at the specified directory (UAT-3 N2 / Plan 07-34).
      description: |
        Multipart upload landing under <dataDir>/notes/<path>. Used by the
        sidebar tree's OS-file drop target — drop on a folder row → file lands
        inside that folder; drop on a note/file → file lands as sibling; drop
        on empty area → file lands at vault root.

        path is passed as a query parameter (mirroring DELETE /folders and the
        sibling GET /files endpoint, Plan 07-32a) because OpenAPI 3.1 has no
        native multi-segment path-wildcard syntax and oapi-codegen does not
        emit chi `*` catch-all routes. Co-locating GET + POST at /files keeps
        the surface coherent: same wire shape for both verbs.

        Refuses .md uploads (markdown bodies must be created via POST /notes).
        Reuses generateUniqueFilename (Plan 07-06) for collision-safe naming.
        Enforces the 100 MB upload cap (D-29). Same 5-rule path-traversal
        pipeline as GET /files (Plan 07-32a) plus a Lstat that ensures the
        target is a directory (NO auto-mkdir — the user creates folders via
        the existing tree UI before dropping).
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: |
            Target DIRECTORY (relative to notes/). "" = vault root.
            "gallery" = notes/gallery/. "gallery/sub" = notes/gallery/sub/.
            Must not contain `..` segments or absolute path prefixes;
            must point to an existing directory (returns 400 otherwise).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File uploaded; returns relative path + final filename.
          content:
            application/json:
              schema:
                type: object
                required: [path, name, size_bytes]
                properties:
                  path:
                    type: string
                    description: Relative path under notes/ (e.g. "gallery/photo-1.png").
                  name:
                    type: string
                    description: Final filename after collision-safe rename.
                  size_bytes:
                    type: integer
                    format: int64
                  content_type:
                    type: string
                    description: MIME sniff of the uploaded bytes.
        "400":
          description: Invalid path / filename / target dir does not exist / .md upload refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Symlink rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: File too large (>100 MB).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [notes]
      operationId: getFile
      summary: Stream any file under the notes vault by relative path (UAT-3 R7 / Plan 07-32a).
      description: |
        Generic file streamer. Returns ANY file located under <dataDir>/notes/<path>
        without requiring a note context. Used by the sidebar tree's file-click
        handler when the user selects a non-markdown file (image attachments,
        PDFs, etc.). Path-traversal hardened with the same 5-rule pipeline as
        GetAttachment. Returns 404 for .md files (use /notes/{id} instead).

        path is passed as a query parameter (mirroring DELETE /folders) because
        OpenAPI 3.1 has no native multi-segment path-wildcard syntax and
        oapi-codegen does not emit chi `*` catch-all routes. The query-param
        approach handles slash-containing relative paths cleanly while keeping
        the route inside the generated StrictServerInterface.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: |
            Canonical relative path under notes/ (e.g. "attachments/photo.png",
            "gallery/attachments/note.pdf"). Must not contain `..` segments or
            absolute path prefixes (validated server-side).
      responses:
        "200":
          description: Binary stream with Content-Type header.
          content:
            application/octet-stream: {}
        "400":
          description: Invalid path (path traversal attempt or absolute path).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Symlink rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: File not found OR path is a .md file (use /notes/{id}).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [notes]
      operationId: deleteFile
      summary: Delete a non-markdown file under notes/ (UAT-4 R7b / Plan 07-38).
      description: |
        Mirrors GetFile's path-traversal pipeline. Refuses .md (those are notes —
        use DELETE /notes/{id}). Refuses directories (use DELETE /folders). Single
        os.Remove call once the path resolves under notes/.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Canonical relative path under notes/ (e.g. "attachments/photo.png").
      responses:
        "204":
          description: File deleted.
        "400":
          description: Invalid path / .md path refused / target is a directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Symlink rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: File not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /files/move:
    post:
      tags: [notes]
      operationId: postFileMove
      summary: Rename / move a non-markdown file under notes/ (UAT-4 R7b / Plan 07-38).
      description: |
        Mirrors POST /folders/move for non-markdown files. Both src_path and
        dst_path are relative under notes/; both run through the 5-rule
        path-traversal pipeline. Refuses .md (those go through POST /notes/{id}/move).
        Refuses overwrite (409 if dst already exists). Atomic os.Rename on POSIX
        same-filesystem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [src_path, dst_path]
              properties:
                src_path:
                  type: string
                  description: Existing relative path under notes/.
                dst_path:
                  type: string
                  description: Target relative path under notes/.
      responses:
        "200":
          description: Move committed; returns the new path.
          content:
            application/json:
              schema:
                type: object
                required: [path, name]
                properties:
                  path:
                    type: string
                  name:
                    type: string
        "400":
          description: Invalid src/dst path / .md path refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Symlink rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Source file not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Destination already exists (refuses overwrite).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /daily-notes/{date}:
    get:
      tags: [notes]
      operationId: getDailyNote
      summary: Get-or-create today's daily note (DAILY-01..03).
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Daily note already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteDetail" }
        "201":
          description: Daily note created from template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteDetail" }
        "400":
          description: Invalid date format.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /search:
    get:
      tags: [notes]
      operationId: searchNotes
      summary: FTS5 full-text search over note bodies and tag values (SEARCH-01..04).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: tag
          in: query
          required: false
          description: AND-combine with a tag filter (D-05).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Result list (empty array when no matches).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "400":
          description: Invalid FTS5 query syntax.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /tree:
    get:
      tags: [tree]
      operationId: getTree
      summary: Return the full folder/file hierarchy under notes/ (TREE-01)
      description: |
        Returns one nested tree document for the entire vault. The shape is a
        tagged union — TreeNode is either {kind:"folder", path, name, children[]}
        or {kind:"note", id, path, title, updated_at}. Sort order: alphabetical
        by name within each level, folders before notes. Used by the sidebar
        FileTree (react-arborist) — Plan 03-06.
      responses:
        "200":
          description: Full tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"
        "500":
          description: Tree projection failed (FS walk / SQLite error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /folders:
    post:
      tags: [folders]
      operationId: postFolders
      summary: Create a folder (TREE-04)
      description: |
        Create an empty folder under {parent_path}/{name}. The server
        canonicalizes the resulting path (NFC + lowercase per DATA-11) and
        rejects case-insensitive collisions. parent_path "" means the vault
        root. Folders are pure FS constructs — there is no `folders` table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderNode"
        "400":
          description: Invalid request (empty name, illegal chars, parent traversal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision OR parent_path does not resolve to a folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [folders]
      operationId: deleteFolder
      summary: Delete a folder (TREE-06) — non-empty requires recursive=true
      description: |
        Delete the folder at the given canonical path. By default (recursive=false)
        the server returns 409 folder_not_empty if the folder has any children.
        The Phase 3 Delete-folder dialog (UI-SPEC §Surface 4) always sets
        recursive=true after the user confirms the content-count copy. Path is
        passed as a query parameter so URL-encoding handles `/` separators
        cleanly — folders have no SQLite identity and so cannot be addressed by
        UUID.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
        - name: recursive
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            When false (default), the server returns 409 folder_not_empty if the
            folder has any children. The Phase 3 Delete-folder dialog (UI-SPEC
            §Surface 4) always sets recursive=true after the user confirms the
            content-count copy.
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid request (missing path, ".." escape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Folder not empty (recursive=false and folder has children)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Delete failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /folders/move:
    post:
      tags: [folders]
      operationId: postFolderMove
      summary: Rename or move a folder (TREE-05, TREE-07)
      description: |
        Atomically renames/moves a folder and re-canonicalizes every contained
        note's path under the new prefix. Implementation note: folders are pure
        FS constructs — there is no `folders` table — so the SQLite update is a
        batch UPDATE notes SET path=... WHERE path LIKE 'old_prefix/%' inside one
        BEGIN IMMEDIATE transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFolderRequest"
      responses:
        "200":
          description: Move committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderNode"
        "400":
          description: Invalid request (empty paths, illegal chars, ".." escape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: old_path does not resolve to a folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Case-insensitive collision with an existing folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Move failed (FS / SQLite mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags:
    get:
      tags: [tags]
      operationId: getTags
      summary: List all tags with note counts (TAGS-03)
      description: |
        Returns all tags present in the vault, sorted alphabetically by name.
        Each entry includes the normalized tag name (D-22: lowercase [a-z0-9_-]+)
        and the count of notes carrying that tag. Feeds the sidebar tag browser
        (D-01..D-03) and the tag autocomplete source (D-07).
        Empty array on empty vault or when no notes have tags.
      responses:
        "200":
          description: Alphabetical list of tags with note counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
  /tags/{name}:
    parameters:
      - $ref: "#/components/parameters/TagName"
    put:
      tags: [tags]
      operationId: putTag
      summary: Rename a tag across all notes (TAGS-06 / D-23)
      description: |
        Rename an existing tag in a single backend transaction. Rewrites the
        `tags:` frontmatter array in every note carrying the tag. Returns the
        list of affected note IDs so the client can refresh stale UI rows.
        Emits a `tags:rewritten` WebSocket batch event.
        Returns 400 if new_name fails charset validation (D-22);
        404 if the old tag does not exist;
        409 if new_name collides with an existing tag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRenameRequest"
      responses:
        "200":
          description: Tag renamed; frontmatter rewritten across all carrying notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRenameResponse"
        "400":
          description: "new_name fails charset validation (D-22: ^[a-z0-9_-]+$)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Tag not found (old name does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: new_name collides with an existing tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Rewrite failed (disk or transaction error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [tags]
      operationId: deleteTag
      summary: Remove a tag from all notes (TAGS-07 / D-24)
      description: |
        Remove an existing tag from the `tags:` frontmatter array in every note
        carrying it, in a single transaction. The tag row is deleted after all
        frontmatter rewrites commit. Returns the list of affected note IDs so
        the client can refresh stale UI rows. Emits a `tags:rewritten` WebSocket
        batch event with new_name=null to indicate deletion (D-34).
        Returns 404 if the tag does not exist.
      responses:
        "200":
          description: Tag removed; frontmatter rewritten across all carrying notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDeleteResponse"
        "404":
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Rewrite failed (disk or transaction error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags/{name}/notes:
    parameters:
      - $ref: "#/components/parameters/TagName"
    get:
      tags: [tags]
      operationId: getTagNotes
      summary: List notes carrying a specific tag (TAGS-04 / D-02)
      description: |
        Returns a flat list of notes that carry the given normalized tag name.
        Results are sorted by note updated_at descending (most-recent first)
        consistent with the tree sidebar's default sort.
        Returns 404 if the tag does not exist in the vault.
      responses:
        "200":
          description: Flat list of notes carrying this tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "404":
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/{id}/backlinks:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      tags: [backlinks]
      operationId: getNoteBacklinks
      summary: List notes that link to this note (LINKS-08 / D-27)
      description: |
        Returns resolved backlinks — notes containing `[[Title]]` references
        that resolve to the note identified by `id`. Pending (unresolved) links
        are not included (D-32). Rows are sorted by source note updated_at
        descending (most-recently-edited source first, per D-28).
        The `excerpt` field is server-built HTML safe for the DOMPurify
        allowlist: `<span>...<mark class="backlink-ref">[[Title]]</mark>...</span>`.
      responses:
        "200":
          description: List of resolved backlinks for this note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinksResponse"
        "404":
          description: Note not found (unknown UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/search-titles:
    get:
      tags: [backlinks]
      operationId: getNotesSearchTitles
      summary: Search note titles for wiki-link autocomplete (LINKS-06 / D-13)
      description: |
        Full-text prefix search over note titles for the `[[` autocomplete popup
        (D-13). Empty `q` returns the most-recently-edited notes up to `limit`.
        Results are ranked by recency (60%) + proximity (40%) per D-13.
        `limit` is capped at 50 (T-06-02-05 DoS mitigation).
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            default: ""
          description: |
            Prefix search string. Empty string (default) returns the most-recent
            notes by last-edit time. Case-insensitive, NFC-normalized.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          description: Maximum number of results to return (default 10, max 50).
      responses:
        "200":
          description: Ranked list of matching note titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSearchResponse"
  /admin/status:
    get:
      tags: [admin]
      operationId: getAdminStatus
      summary: Report the migration runner state
      description: |
        Returns the migration runner state for the UX-03 banner. The frontend
        `useMigrationStatus()` hook polls this on mount; Phase 4 will swap the
        client to a `migration:status` WebSocket event without changing the
        wire shape.
      responses:
        "200":
          description: Current migration runner state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationStatus"
  /config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read user configuration
      description: |
        Returns the current config.json contents (DESIGN.md §11).
        Phase 5 wires only the `theme` field to UI; other fields
        ship with sensible defaults but are not yet surfaced
        (UX-V2-01 will surface them in v2).
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
    put:
      tags: [config]
      operationId: putConfig
      summary: Replace user configuration (whole-document)
      description: |
        Writes config.json atomically via fsstore.AtomicWrite
        (DATA-13: temp + fsync + rename + fsync(parent)).
        Strict (D-40): unknown fields → 400 invalid_request.
        The whole document is replaced — there is no PATCH semantic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Config" }
      responses:
        "200":
          description: Config saved; echoes the persisted document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
        "400":
          description: Invalid request (malformed body, unknown field, out-of-range numeric)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Save failed (filesystem error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /ws:
    get:
      tags: [ws]
      operationId: getApiV1Ws
      summary: WebSocket endpoint (HTTP/1.1 Upgrade)
      description: |
        Server-broadcast WebSocket. Client opens with
        `?session_id=<uuid>` query parameter (Pitfall 1: client-as-
        authoritative session_id). Server responds with a
        `session:assigned` envelope confirming the id, then streams
        events until disconnect.

        oapi-codegen generates a stub handler for this route which is
        unreachable: lifecycle.go (Plan 04-04) mounts `/ws` via
        wshub.Hub.ServeHTTP BEFORE api.HandlerFromMux. The path exists
        in the spec to satisfy API-01 ("every HTTP route in the spec").

        Origin enforcement: the Accept call in wshub.Hub.ServeHTTP
        (Plan 04-02) sets OriginPatterns: ["localhost:*", "127.0.0.1:*"].
        The OpenAPI spec does NOT and CANNOT enforce origin — that is a
        runtime control on the upgrade handshake (T-04-01).
      x-jasper-websocket: true
      parameters:
        - name: session_id
          in: query
          required: false
          description: |
            Per-tab UUID generated by the client (sessionStorage).
            Server adopts this as the connection's session_id; the
            handshake message echoes it for confirmation. Treated as
            opaque; max length 128 chars enforced in middleware
            (T-04-03).
          schema:
            type: string
            format: uuid
            maxLength: 128
      responses:
        "101":
          description: Switching protocols (WebSocket upgrade)
        "400":
          description: Not a WebSocket request
  /admin/reindex:
    post:
      tags: [admin]
      operationId: postAdminReindex
      summary: Trigger a full or incremental re-index
      description: |
        Phase 2 backs DATA-10: drop the derived tables, re-run migrations on a
        clean schema, and walk every `.md` file. Phase 2 runs synchronously and
        returns 202 only after the rebuild finishes; Phase 4 will switch to async
        execution streaming progress over WebSocket without a contract break.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexRequest"
      responses:
        "202":
          description: Re-index accepted; Phase 2 returns after completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexResponse"
        "409":
          description: A re-index is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Database is in unrecoverable state (Path 3 fired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reveal:
    post:
      tags: [sharing]
      operationId: postReveal
      summary: Reveal a note path in the host OS file manager (SHARE-01)
      description: |
        Phase 8 SHARE-01 / D-26 / D-27. Opens the host OS file manager
        with the named path selected. macOS uses `open -R <path>`
        (Finder reveal). WSL2 uses `explorer.exe /select,<windows-path>`
        with the WSL path translated to a Windows UNC path.
        Linux-native is not a v1 target (D-28) — handler returns 501.

        The `path` field is the path under the vault, relative to
        notes/. The handler resolves it through the same
        canonicalization used by GET /notes (DATA-11) to prevent
        traversal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealRequest"
      responses:
        "200":
          description: File manager launched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealResponse"
        "400":
          description: Invalid path (traversal, empty, outside vault)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: File manager exec failed (system error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not supported on this platform (e.g. Linux native — D-28)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mcp/grants:
    get:
      tags: [mcp]
      operationId: getMcpGrants
      summary: List all MCP write grants (MCP-01)
      description: |
        Returns every row in the mcp_write_grants table (Phase 8 migration
        004). The frontend tree menu reads this list to render
        "MCP write" indicators per folder (D-17). Folders without a row
        are deny-by-default; grants at an ancestor folder grant writes
        recursively (D-18, resolved server-side at write time).
      responses:
        "200":
          description: All MCP write grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpGrantList"
    post:
      tags: [mcp]
      operationId: postMcpGrant
      summary: Grant (or upgrade) MCP write access for a folder (MCP-01, D-17)
      description: |
        Idempotent grant for `folder_path` at `level` (1 = create+update;
        2 = create+update+move+delete). If the folder already has a row,
        the level is updated to the requested value (upgrade or
        downgrade); `granted_at` is refreshed; `granted_via` updates to
        reflect the new entry point. Broadcasts `mcp:grant_changed` on
        the WS hub so every connected tab refreshes its indicators
        (D-57).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpGrantRequest"
      responses:
        "200":
          description: Grant created or upgraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpGrant"
        "400":
          description: Invalid path or level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [mcp]
      operationId: deleteMcpGrant
      summary: Revoke MCP write access for a folder (D-17)
      description: |
        Deletes the grant row for `folder_path`. Does NOT recurse —
        ancestor grants still apply per D-18. Broadcasts
        `mcp:grant_changed` on success.
      parameters:
        - name: path
          in: query
          required: true
          description: folder_path of the grant to revoke (canonical NFC+lowercase).
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: Grant deleted
        "404":
          description: No grant exists for that folder_path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: First-run wizard status (INSTALL-07, D-04)
      description: |
        Returns whether the first-run wizard still needs to run.
        `first_run = true` when no resolved `cfg.Server.DataDir` is
        present (the user has not yet completed the wizard). The
        frontend redirects to /setup when this returns true (D-04
        wizard mount).
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup/validate-data-dir:
    post:
      tags: [setup]
      operationId: postSetupValidateDataDir
      summary: Debounced wizard-side validation of a proposed data directory (D-08)
      description: |
        Called by the wizard as the user types a data-directory path.
        Validates: parent exists, path is not nested inside an existing
        vault, path is writable, path contains only ASCII characters.
        Returns a structured `code` so the wizard can render an inline
        error message. Does NOT persist anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupValidateRequest"
      responses:
        "200":
          description: Validation result (valid OR invalid with code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupValidateResponse"
  /setup:
    post:
      tags: [setup]
      operationId: postSetup
      summary: Submit the first-run wizard (INSTALL-07, D-10)
      description: |
        Persists the wizard payload: writes <data_dir>/storage/config.json
        with the wizard-supplied theme, MCP enabled flag, MCP grants,
        and daily-notes template, then runs migrations against the new
        data dir. On success the frontend redirects to /. Only callable
        when `GET /setup/status` returns `first_run: true` — repeat calls
        are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Setup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
        "400":
          description: Invalid request (bad path, malformed body, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Setup failed (filesystem error, migration failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/by-path:
    get:
      tags: [notes]
      operationId: getNoteByPath
      summary: Lookup a note by its relative path (D-30 deep-link fallback)
      description: |
        Phase 8 D-30 deep-link fallback. Used by the `?path=<rel>` URL
        parameter when the canonical `/notes/{id}` form is not available
        (e.g. someone shares a permalink across machines and the UUIDs
        differ but the path is stable). Server canonicalizes `path` via
        the same DATA-11 rules as the rest of the API.
      parameters:
        - name: path
          in: query
          required: true
          description: Relative path under notes/, e.g. "projects/foo.md".
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Note metadata for the matched path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSummary"
        "400":
          description: Path failed validation (traversal, absolute, non-.md, or empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No note exists at that path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    NoteId:
      name: id
      in: path
      required: true
      description: UUID of the note (Phase 1 has exactly one — see scratchpad UUID in code)
      schema:
        type: string
        format: uuid
    TagName:
      name: name
      in: path
      required: true
      description: |
        Normalized tag name (D-22: lowercase letters, digits, hyphens, underscores only;
        pattern ^[a-z0-9_-]+$). URL-encoded when the tag contains hyphens or underscores.
      schema:
        type: string
        pattern: "^[a-z0-9_-]+$"
        minLength: 1
        maxLength: 64
  schemas:
    Note:
      type: object
      required: [id, path, content, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: "00000000-0000-4000-a000-000000000001"
        path:
          type: string
          description: Canonicalized relative path under notes/ (NFC + lowercase per DATA-11)
          example: "scratchpad.md"
        content:
          type: string
          description: Raw markdown content of the note
        updated_at:
          type: string
          format: date-time
          description: Wall-clock UTC time of the last successful write
    UpdateNoteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: New raw markdown content; replaces the entire file
    UpdateNoteResponse:
      type: object
      required: [id, path, updated_at]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        updated_at:
          type: string
          format: date-time
    NoteSummary:
      type: object
      required: [id, path, title, updated_at]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
          example: "scratchpad.md"
        title:
          type: string
          description: First-H1 title or filename without `.md`; never empty
          example: "Welcome to Jasper"
        updated_at:
          type: string
          format: date-time
          description: Wall-clock UTC of last filesystem mtime observed by the indexer
    NoteDetail:
      type: object
      required: [id, path, content, updated_at]
      description: |
        Full note detail including content, returned by get-or-create endpoints
        such as GET /daily-notes/{date}.
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Canonicalized relative path under notes/ (NFC + lowercase per DATA-11)
        content:
          type: string
          description: Raw markdown content of the note
        updated_at:
          type: string
          format: date-time
          description: Wall-clock UTC time of the last successful write
        tags:
          type: array
          items:
            type: string
          description: Normalized tag names extracted from YAML frontmatter.
    NoteList:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSummary"
    MigrationStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: |
            Current migration runner state. Surfaces the three-path resilience
            model from DESIGN.md §4.4.
              - "ok"            — schema is current; no action required
              - "rolled_back"   — Path 1 fired; previous schema active; banner shown (UX-03)
              - "rebuilding"    — Path 2 in progress; UI shows ReindexProgress overlay
              - "unrecoverable" — Path 3 fired; static error page is served and the SPA cannot reach this endpoint (documented for future use)
          enum: [ok, rolled_back, rebuilding, unrecoverable]
        failed_migration:
          type: string
          description: Filename of the migration that triggered Path 1 (only set when state=rolled_back)
          example: "003_tags.sql"
        logs_path:
          type: string
          description: Absolute path to the structured log file (only set when state in {rolled_back, unrecoverable})
          example: "/Users/me/.jasper/storage/logs/jasper.log"
        notes_indexed:
          type: integer
          description: Count of rows currently in the `notes` table (informational)
          example: 1247
    ReindexRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [full, incremental]
          default: full
          description: |
            "full"        — Path 2: drop derived tables, re-run all migrations on the new (clean) schema, walk every .md file
            "incremental" — re-run the cheap mtime-based delta scan only (DATA-09)
    ReindexResponse:
      type: object
      required: [started_at]
      properties:
        started_at:
          type: string
          format: date-time
          description: Wall-clock UTC when the reindex began (Phase 2 returns AFTER it finishes; this is still the start time)
        notes_indexed:
          type: integer
          description: Count of rows in the `notes` table after the reindex completed (Phase 2 only — Phase 4 streams this via WS)
    CreateNoteRequest:
      type: object
      required: [parent_path, title]
      properties:
        parent_path:
          type: string
          description: |
            Canonical relative path under notes/ to the parent folder, or ""
            for the vault root. NFC + lowercase per DATA-11; the server
            re-canonicalizes defensively.
          example: "projects/jasper"
        title:
          type: string
          description: Note title (basename without `.md`); the server appends `.md`.
          example: "design-notes"
    MoveNoteRequest:
      type: object
      required: [new_path]
      properties:
        new_path:
          type: string
          description: New canonical relative path under notes/ (with `.md` extension).
          example: "projects/jasper/design.md"
    CreateFolderRequest:
      type: object
      required: [parent_path, name]
      properties:
        parent_path:
          type: string
          description: |
            Canonical relative path under notes/ to the parent folder, or ""
            for the vault root.
          example: "projects"
        name:
          type: string
          description: New folder basename (single path segment, no `/`).
          example: "jasper"
    MoveFolderRequest:
      type: object
      required: [old_path, new_path]
      properties:
        old_path:
          type: string
          description: Current canonical relative path under notes/ for the folder.
          example: "projects/old-name"
        new_path:
          type: string
          description: New canonical relative path under notes/ for the folder.
          example: "projects/new-name"
    FolderNode:
      type: object
      required: [kind, path, name]
      properties:
        kind:
          type: string
          enum: [folder]
          description: Discriminator value identifying this node as a folder.
        path:
          type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
          example: "projects/jasper"
        name:
          type: string
          description: Basename (last path segment).
          example: "jasper"
        children:
          type: array
          description: |
            ONLY populated when this FolderNode appears inside a Tree response.
            Empty (or omitted) when used as a standalone response (POST /folders,
            POST /folders/move).
          items:
            $ref: "#/components/schemas/TreeNode"
    NoteNode:
      type: object
      required: [kind, id, path, title, updated_at]
      properties:
        kind:
          type: string
          enum: [note]
          description: Discriminator value identifying this node as a note.
        id:
          type: string
          format: uuid
        path:
          type: string
          description: Canonical relative path under notes/ (NFC + lowercase per DATA-11)
        title:
          type: string
          description: First-H1 title or filename without `.md`; never empty.
        updated_at:
          type: string
          format: date-time
          description: Wall-clock UTC of last filesystem mtime observed by the indexer.
    FileNode:
      type: object
      description: |
        A non-markdown file inside notes/. Surfaced in the tree response so users
        can browse attachments and other files directly from the sidebar.
        Click handling is frontend-driven (window.open + appropriate stream URL).
      required: [kind, path, name]
      properties:
        kind:
          type: string
          enum: [file]
          description: "Discriminator — always 'file'."
        path:
          type: string
          description: "Canonical relative path under notes/ (NFC + lowercased)."
        name:
          type: string
          description: "Filename (basename of path)."
        size_bytes:
          type: integer
          format: int64
          description: "File size in bytes. Optional; may be omitted for performance."
        content_type:
          type: string
          description: "MIME content type (sniffed by file-stream endpoint on demand). Optional."
    TreeNode:
      oneOf:
        - $ref: "#/components/schemas/FolderNode"
        - $ref: "#/components/schemas/NoteNode"
        - $ref: "#/components/schemas/FileNode"
      discriminator:
        propertyName: kind
        mapping:
          folder: "#/components/schemas/FolderNode"
          note: "#/components/schemas/NoteNode"
          file: "#/components/schemas/FileNode"
    Tree:
      type: object
      required: [root]
      properties:
        root:
          type: array
          description: |
            Top-level (root) entries — children of the vault root (notes/). The
            ROOT itself is implicit; folders nest via children[].
          items:
            $ref: "#/components/schemas/TreeNode"
    Config:
      type: object
      required: [appName, dailyNotes, editor, theme]
      additionalProperties: false   # D-40 strict — unknown keys → 400
      # Phase 8 (D-50 / D-47) extends this schema with `server` and
      # `mcp` blocks. They are NOT in `required` so existing config.json
      # files on disk (written by Phases 5–7) continue to load; the Go
      # side fills defaults in load.go when the blocks are absent.
      # `additionalProperties: false` still holds — PUT /config payloads
      # carrying `server` or `mcp` round-trip cleanly. PUT bodies missing
      # them are accepted (strict validator pre-fills defaults).
      properties:
        appName:
          type: string
          minLength: 1
          maxLength: 64
          default: "Jasper"
        theme:
          type: string
          enum: [dark, light]
          default: dark
        dailyNotes:
          type: object
          required: [folder, template]
          additionalProperties: false
          properties:
            folder:
              type: string
              minLength: 1
              maxLength: 64
              default: "daily"
            template:
              type: string
              maxLength: 1024
              default: ""
        editor:
          type: object
          required: [fontSize, lineHeight, vimMode]
          additionalProperties: false
          properties:
            fontSize:
              type: integer
              minimum: 8
              maximum: 32
              default: 15
            lineHeight:
              type: number
              minimum: 1
              maximum: 3
              default: 1.6
            vimMode:
              type: boolean
              default: false
        server:
          # Phase 8 D-50 / D-40: HTTP listener port + resolved data
          # directory. Port pinned at 6683 (T9 spelling of "NOTE");
          # wizard does NOT expose a port override (config-file edit only).
          # DataDir is set by the first-run wizard (08-02 / D-04) and
          # re-read at every server boot.
          type: object
          required: [port, dataDir]
          additionalProperties: false
          properties:
            port:
              type: integer
              minimum: 1
              maximum: 65535
              default: 6683
            dataDir:
              type: string
              minLength: 1
        mcp:
          # Phase 8 D-14 / D-15 / D-47: optional secondary HTTP listener
          # serving the MCP StreamableHTTP endpoint. Disabled by default;
          # the first-run wizard (08-02) writes `enabled` based on the
          # opt-in checkbox. Port pinned at 6684 (D-47). Bind is loopback-
          # only (127.0.0.1), enforced at listener startup via
          # netbind.RequireLoopbackBind (D-15).
          type: object
          required: [enabled, port, bind]
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              default: false
            port:
              type: integer
              minimum: 1
              maximum: 65535
              default: 6684
            bind:
              type: string
              default: "127.0.0.1"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "not_found"
        message:
          type: string
          example: "no note with id 00000000-0000-4000-a000-000000000001"
    TagWithCount:
      type: object
      required: [name, count]
      description: A single tag entry with the number of notes carrying it.
      properties:
        name:
          type: string
          description: Normalized tag name (D-22 charset; lowercase [a-z0-9_-]+)
          example: "project"
        count:
          type: integer
          minimum: 0
          description: Number of notes in the vault that carry this tag
          example: 12
    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagWithCount"
          description: All tags in the vault, sorted alphabetically by name.
    TagRenameRequest:
      type: object
      required: [new_name]
      properties:
        new_name:
          type: string
          pattern: "^[a-z0-9_-]+$"
          minLength: 1
          maxLength: 64
          description: |
            New tag name. Must match D-22 charset (lowercase letters, digits,
            hyphens, underscores only). Server re-validates server-side (T-06-02-01
            defense-in-depth).
          example: "work"
    TagRenameResponse:
      type: object
      required: [old_name, new_name, touched_note_ids]
      properties:
        old_name:
          type: string
          description: The tag name before the rename.
        new_name:
          type: string
          description: The tag name after the rename.
        touched_note_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of notes whose frontmatter was rewritten.
    TagDeleteResponse:
      type: object
      required: [old_name, touched_note_ids]
      properties:
        old_name:
          type: string
          description: The tag name that was deleted.
        touched_note_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of notes whose frontmatter was rewritten (tag removed).
    AttachmentUploadResult:
      type: object
      required: [filename, path, content_type, category, is_image, size_bytes]
      properties:
        filename:     { type: string, description: "Final stored filename (auto-renamed on collision per ATTACH-04)." }
        path:         { type: string, description: "Path relative to the note's parent directory, e.g., 'attachments/image-1.png'." }
        content_type: { type: string, description: "MIME type from http.DetectContentType (D-27)." }
        category:     { type: string, enum: [image, pdf, video, audio, archive, other] }
        is_image:     { type: boolean }
        size_bytes:   { type: integer, format: int64 }
    BacklinkRow:
      type: object
      required: [source_id, source_title, source_path, excerpt, count]
      description: |
        A single backlink entry: a note that contains a `[[...]]` reference
        resolving to the target note. One row per source note — multiple
        references from the same source note collapse into one row with a
        `count` badge (D-29).
      properties:
        source_id:
          type: string
          format: uuid
          description: UUID of the note containing the `[[...]]` reference.
        source_title:
          type: string
          description: Title of the source note (first H1 or filename without .md).
        source_path:
          type: string
          description: Canonical relative path of the source note under notes/.
        excerpt:
          type: string
          description: |
            Server-built HTML excerpt showing the line containing the first
            `[[...]]` reference. Safe for the DOMPurify allowlist:
            `<span>...<mark class="backlink-ref">[[Title]]</mark>...</span>`.
            Max 200 characters of visible text. Client MUST sanitize via
            sanitize.ts before setting dangerouslySetInnerHTML (T-06-02-04).
        count:
          type: integer
          minimum: 1
          description: |
            Number of distinct `[[...]]` references in this source note that
            resolve to the target. Used for the count badge (D-29).
    BacklinksResponse:
      type: object
      required: [backlinks]
      properties:
        backlinks:
          type: array
          items:
            $ref: "#/components/schemas/BacklinkRow"
          description: |
            Resolved backlinks sorted by source note updated_at descending
            (most-recently-edited source first, per D-28).
    NoteSearchResult:
      type: object
      required: [id, title, recency_score]
      description: A single note-title search result for wiki-link autocomplete.
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the matching note.
        title:
          type: string
          description: Title of the matching note (first H1 or filename without .md).
        folder:
          type: string
          nullable: true
          description: |
            Containing folder path (relative under notes/, without trailing slash),
            or null for vault-root notes. Shown in autocomplete dropdown to
            disambiguate notes with the same title.
        recency_score:
          type: number
          description: |
            0.0–1.0 recency component of the ranking score (higher = more recent).
            60% weight in the combined score per D-13.
        proximity_score:
          type: number
          nullable: true
          description: |
            0.0–1.0 proximity component (same-folder boost) or null when no
            source folder context is provided. 40% weight in the combined score.
    NoteSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/NoteSearchResult"
          description: Ranked note title search results, best match first.
    WSTagsRewrittenPayload:
      type: object
      required: [old_name, touched_note_ids]
      description: |
        Broadcast payload for `tags:rewritten` events. Emitted when a tag is
        renamed (D-23 / TAGS-06) or deleted (D-24 / TAGS-07). When new_name is
        null, the tag was deleted (D-34). Source tab suppresses its own broadcast
        via the origin_session_id filter (D-35).
      properties:
        old_name:
          type: string
          description: The tag name before the rename/delete.
        new_name:
          type: string
          nullable: true
          description: The new tag name, or null when the tag was deleted.
        touched_note_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of notes whose frontmatter was rewritten.
    WSLinksRewrittenPayload:
      type: object
      required: [old_title, new_title, touched_note_ids]
      description: |
        Broadcast payload for `links:rewritten` events. Emitted when a note is
        renamed and its wiki-link references are rewritten vault-wide (LINKS-07 /
        D-33). Source tab suppresses its own broadcast via origin_session_id (D-35).
      properties:
        old_title:
          type: string
          description: The note title before the rename.
        new_title:
          type: string
          description: The note title after the rename.
        touched_note_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of notes whose content was rewritten.
    WSEnvelope:
      type: object
      description: |
        WebSocket event envelope (DESIGN.md §5.2). The `event` enum is
        locked verbatim and mirrors the Go const block in
        backend/internal/wshub/envelope.go and the TS dispatch table
        in frontend/src/lib/useSessionSync.ts.
      required: [event, origin_session_id, payload]
      properties:
        event:
          type: string
          enum:
            - "session:assigned"
            - "note:created"
            - "note:updated"
            - "note:deleted"
            - "note:moved"
            - "folder:created"
            - "folder:deleted"
            - "folder:moved"
            - "tags:updated"
            - "tags:rewritten"
            - "links:rewritten"
            - "reindex:started"
            - "reindex:complete"
            - "migration:status"
            - "mcp:grant_changed"
        origin_session_id:
          type: string
          description: |
            UUID of the session that originated the mutation. Empty
            string for server-originated events (reindex:*,
            migration:status). Clients ignore events whose
            origin_session_id matches their own (SYNC-03 origin
            filter).
        payload:
          description: Event-specific payload; shape determined by `event`.
    WSNoteCreatedPayload:
      type: object
      required: [id, path, title, updated_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        title: { type: string }
        updated_at: { type: string, format: date-time }
    WSNoteUpdatedPayload:
      type: object
      required: [id, path, updated_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        updated_at: { type: string, format: date-time }
    WSNoteDeletedPayload:
      type: object
      required: [id, path]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
    WSNoteMovedPayload:
      type: object
      # title is REQUIRED so receiving tabs do not need to round-trip
      # GET /tree to refresh the tree row label after a rename — the
      # broadcast carries the freshly-extracted H1 (or filename
      # fallback) directly. Service.Move re-extracts the title on
      # every move (Plan 03-21); this field exposes it on the wire.
      # WR-06.
      required: [id, old_path, new_path, updated_at, title]
      properties:
        id: { type: string, format: uuid }
        old_path: { type: string }
        new_path: { type: string }
        updated_at: { type: string, format: date-time }
        title: { type: string }
    WSFolderCreatedPayload:
      type: object
      required: [path, name]
      properties:
        path: { type: string }
        name: { type: string }
    WSFolderDeletedPayload:
      type: object
      required: [path, recursive]
      properties:
        path: { type: string }
        recursive: { type: boolean }
    WSFolderMovedPayload:
      type: object
      required: [old_path, new_path]
      properties:
        old_path: { type: string }
        new_path: { type: string }
    WSReindexStartedPayload:
      type: object
      description: Empty payload — server-originated.
      properties: {}
    WSReindexCompletePayload:
      type: object
      required: [notes_indexed]
      properties:
        notes_indexed: { type: integer }
    SearchResult:
      type: object
      required: [id, title, path, excerpt_html, matching_tags, rank, modified_at]
      properties:
        id:            { type: string }
        title:         { type: string }
        path:          { type: string }
        excerpt_html:  { type: string, description: "Server-sanitized HTML containing <mark> tags around matched terms (D-04)." }
        matching_tags: { type: array, items: { type: string } }
        rank:          { type: number, description: "bm25 + recency score; lower is better (negative floats)." }
        modified_at:   { type: string, format: date-time }
    SearchResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
    StaleWriteError:
      type: object
      description: |
        Returned by PUT /notes/{id} when If-Match does not match the
        current file's updated_at (SYNC-06). The client surfaces
        SYNC-05's Save-anyway / Discard banner using
        current_updated_at as the new comparator.
      required: [code, message, current_updated_at]
      properties:
        code:
          type: string
          enum: [stale_write]
        message:
          type: string
        current_updated_at:
          type: string
          format: date-time
    # ----- Phase 8 schemas (D-26, D-13, D-17, D-04, D-08, D-10, D-30) -----
    RevealRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          description: Vault-relative path of the file to reveal (canonical NFC+lowercase).
    RevealResponse:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
          enum: [darwin, wsl2]
          description: Host platform the reveal was executed on (D-26 / D-28).
    McpGrant:
      type: object
      required: [folder_path, level, granted_at, granted_via]
      properties:
        folder_path:
          type: string
          minLength: 1
          description: Canonical NFC+lowercase rel path under notes/ (DATA-11).
        level:
          type: integer
          enum: [1, 2]
          description: "1 = create+update (default); 2 = create+update+move+delete (D-13)."
        granted_at:
          type: string
          format: date-time
        granted_via:
          type: string
          description: "Entry point that created the grant: 'wizard' | 'tree-context-menu' | 'tree-dropdown-menu' (D-17 telemetry)."
    McpGrantSeed:
      type: object
      required: [folder, level]
      description: "Wizard payload form of an MCP grant (used inside SetupRequest.mcp_grants)."
      properties:
        folder:
          type: string
          minLength: 1
        level:
          type: integer
          enum: [1, 2]
    McpGrantList:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/McpGrant" }
    McpGrantRequest:
      type: object
      required: [folder_path, level]
      properties:
        folder_path:
          type: string
          minLength: 1
        level:
          type: integer
          enum: [1, 2]
    SetupStatus:
      type: object
      required: [first_run]
      properties:
        first_run:
          type: boolean
          description: True when the first-run wizard has not yet been completed (D-04).
    SetupValidateRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
    SetupValidateResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        code:
          type: string
          enum: [parent_missing, nested_vault, unwritable, non_ascii]
          description: Structured error code when valid=false (D-08).
        message:
          type: string
          description: Human-readable error message when valid=false.
    SetupRequest:
      type: object
      required: [data_dir, theme, mcp_enabled, mcp_grants, daily_template, create_today_daily_note]
      properties:
        data_dir:
          type: string
          minLength: 1
        theme:
          type: string
          enum: [dark, light]
        mcp_enabled:
          type: boolean
        mcp_grants:
          type: array
          items: { $ref: "#/components/schemas/McpGrantSeed" }
        daily_template:
          type: string
          maxLength: 1024
        create_today_daily_note:
          type: boolean
    SetupResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
