<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jasper — Migration Failed</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #18181b;
      color: #e4e4e7;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { max-width: 520px; }
    h1 { font-size: 16px; font-weight: 600; margin: 24px 0 16px; }
    code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #a1a1aa; }
    p.muted { color: #a1a1aa; font-size: 12px; }
    .icon { color: #fbbf24; }
    .log { background: #27272a; border: 1px solid #3f3f46; border-radius: 6px; padding: 12px 16px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; line-height: 1.5; color: #a1a1aa; max-height: 320px; overflow: auto; margin: 0; }
  </style>
</head>
<body>
  <main>
    <svg class="icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2v8" />
      <path d="m16 6-4 4-4-4" />
      <rect width="20" height="8" x="2" y="14" rx="2" />
      <path d="M6 18h.01" />
      <path d="M10 18h.01" />
    </svg>
    <h1>Migration couldn't complete safely.</h1>
    <p>Your notes on disk are safe — the filesystem is the source of truth.</p>
    <p>The migration runner exhausted its recovery options. To rebuild the database from your notes, restart Jasper with: <code>jasper serve --reset-and-rebuild</code>.</p>
    <p class="muted">Logs: <code>{{.LogsPath}}</code></p>
    <pre class="log">{{.LogExcerpt}}</pre>
  </main>
</body>
</html>
