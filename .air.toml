# Air config — paths resolve from the project root (where this file lives).
# Run via `make dev` (which `cd ..`'s from frontend/ then invokes `go tool air`).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/jasper ./backend/cmd/jasper"
  bin = "./tmp/jasper"
  # Phase 8 D-40: dev backend uses serve.go's defaultListenAddr (127.0.0.1:6683).
  # The Vite proxy in frontend/vite.config.ts reads the same port from
  # scripts/port.sh so dev <-> prod parity is automatic. A user who sets a
  # custom server.port in ~/.jasper/storage/config.json should also pass
  # --addr 127.0.0.1:<port> here OR rely on the binary's eventual config-driven
  # bind (the wizard does NOT expose server.port — file-edit override only per D-50).
  full_bin = "./tmp/jasper serve --data-dir ./tmp/jasper-data"
  include_ext = ["go", "sql"]
  include_dir = ["backend/cmd", "backend/internal", "backend/migrations"]
  exclude_dir = ["tmp", "node_modules", "frontend", ".planning", "bin"]
  delay = 500

[log]
  time = true
